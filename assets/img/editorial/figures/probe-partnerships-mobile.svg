<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1479" viewBox="0 0 800 1479" role="img"><title>probe-partnerships</title><rect width="800" height="1479" fill="#ffffff"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="52.0" font-size="26" fill="#a36b42" font-weight="600">產業研究  /  圖解</text><text x="44" y="118.0" font-size="42" fill="#202421" font-weight="600">合作公告，先讀交易狀態與分工</text><text x="44" y="183.1" font-size="29" fill="#59615e" font-weight="400">股權、技術協作與採購安排，代表不同層次的證據。</text><path d="M66 256.05L66 426.05" stroke="#cbd1cd" stroke-width="3" fill="none"/><circle cx="66" cy="279.05" r="11" fill="#a36b42"/><text x="98" y="287.1" font-size="26" fill="#a36b42" font-weight="600">2024.05｜已完成</text><text x="98" y="336.1" font-size="32" fill="#263c46" font-weight="600">Teradyne × Technoprobe</text><text x="98" y="385.7" font-size="26" fill="#59615e" font-weight="400">當時股權投資與 DIS 業務交易完成；歷史比例不等於目</text><text x="98" y="426.0" font-size="26" fill="#59615e" font-weight="400">前持股。</text><path d="M66 492.25000000000006L66 662.25" stroke="#cbd1cd" stroke-width="3" fill="none"/><circle cx="66" cy="515.25" r="11" fill="#a36b42"/><text x="98" y="523.2" font-size="26" fill="#a36b42" font-weight="600">2025.01｜公告投資與協作</text><text x="98" y="572.2" font-size="32" fill="#263c46" font-weight="600">Advantest × 兩家介面供應商</text><text x="98" y="621.9" font-size="26" fill="#59615e" font-weight="400">少數股權與生態合作，不能推定獨家供應或保證訂單。</text><path d="M66 688.15L66 858.15" stroke="#cbd1cd" stroke-width="3" fill="none"/><circle cx="66" cy="711.15" r="11" fill="#a36b42"/><text x="98" y="719.1" font-size="26" fill="#a36b42" font-weight="600">2025.12｜協議分工</text><text x="98" y="768.1" font-size="32" fill="#263c46" font-weight="600">Technoprobe × WinWay × MS SUN</text><text x="98" y="817.8" font-size="26" fill="#59615e" font-weight="400">技術、智財、整合與採購各有責任；最低採購安排不等</text><text x="98" y="858.0" font-size="26" fill="#59615e" font-weight="400">於已認列收入。</text><path d="M66 924.35L66 1094.35" stroke="#cbd1cd" stroke-width="3" fill="none"/><circle cx="66" cy="947.35" r="11" fill="#a36b42"/><text x="98" y="955.4" font-size="26" fill="#a36b42" font-weight="600">2026.10｜協議待完成條件</text><text x="98" y="1004.4" font-size="32" fill="#263c46" font-weight="600">FormFactor × Teradyne</text><text x="98" y="1054.0" font-size="26" fill="#59615e" font-weight="400">3 億美元股權安排仍有交割條件；公告與已完成投資分</text><text x="98" y="1094.2" font-size="26" fill="#59615e" font-weight="400">開。</text><path d="M44 1170.55L756 1170.55" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="44" y="1214.5" font-size="26" fill="#59615e" font-weight="400">以來源所述事件狀態整理；不推論未揭露的售價、毛利、採購</text><text x="44" y="1254.8" font-size="26" fill="#59615e" font-weight="400">排他或已完成交割。</text><text x="44" y="1329.1" font-size="26" fill="#263c46" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="1374.1" font-size="26" fill="#59615e" font-weight="400">資料：Teradyne SEC [11]；Advantest [13]；FormFactor／</text><text x="44" y="1414.4" font-size="26" fill="#59615e" font-weight="400">SEC [14、18]；Technoprobe [17]｜整理：2026.10.19</text></g></svg>