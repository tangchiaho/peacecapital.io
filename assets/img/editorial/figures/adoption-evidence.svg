<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="787" viewBox="0 0 1440 787" role="img"><title>adoption-evidence</title><rect width="1440" height="787" fill="#ffffff"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="52.0" font-size="23" fill="#a36b42" font-weight="600">產業研究  /  圖解</text><text x="44" y="118.0" font-size="48" fill="#202421" font-weight="600">測試通過之後，還要回答什麼？</text><text x="44" y="192.4" font-size="28" fill="#59615e" font-weight="400">三種不同的證據，可以平行補強；不是共同認證制度。</text><path d="M44.0 273.8L476.0 273.8" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="68.0" y="311.8" font-size="23" fill="#a36b42" font-weight="600">01</text><text x="68.0" y="350.8" font-size="32" fill="#202421" font-weight="600">技術可行</text><text x="68.0" y="420.4" font-size="27" fill="#59615e" font-weight="400">試片與測試報告，界定牌號、方</text><text x="68.0" y="462.2" font-size="27" fill="#59615e" font-weight="400">法與測試條件的性能範圍。</text><path d="M504.0 273.8L936.0 273.8" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="528.0" y="311.8" font-size="23" fill="#a36b42" font-weight="600">02</text><text x="528.0" y="350.8" font-size="32" fill="#202421" font-weight="600">客戶可用</text><text x="528.0" y="420.4" font-size="27" fill="#59615e" font-weight="400">零件、加工窗口與跨批次結果，</text><text x="528.0" y="462.2" font-size="27" fill="#59615e" font-weight="400">確認能否放進指定產線。</text><path d="M964.0 273.8L1396.0 273.8" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="988.0" y="311.8" font-size="23" fill="#a36b42" font-weight="600">03</text><text x="988.0" y="350.8" font-size="32" fill="#202421" font-weight="600">生意可持續</text><text x="988.0" y="420.4" font-size="27" fill="#59615e" font-weight="400">交付、重複採購與回款，連同服</text><text x="988.0" y="462.2" font-size="27" fill="#59615e" font-weight="400">務及資本投入評估。</text><path d="M44 567.1L1396 567.1" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="44" y="611.1" font-size="25" fill="#59615e" font-weight="400">各項進展可能不同步；材料名稱、製程或配置改變時，原有證據的適用範圍需重新核對。</text><text x="44" y="683.9" font-size="26" fill="#263c46" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="728.9" font-size="22" fill="#59615e" font-weight="400">資料：UL、BASF、Toray／NCAMP；本文案例與研究問題 [1–4]｜整理：2026.10.19</text></g></svg>