<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1482" viewBox="0 0 800 1482" role="img"><title>micron-timeline</title><rect width="800" height="1482" fill="#ffffff"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="52.0" font-size="26" fill="#a36b42" font-weight="600">產業研究  /  圖解</text><text x="44" y="118.0" font-size="42" fill="#202421" font-weight="600">同樣叫 HBM4，版本與狀態仍不同</text><text x="44" y="183.1" font-size="29" fill="#59615e" font-weight="400">Micron 公開事件｜36GB 12 層與 48GB 16 層分開看</text><path d="M66 256.05L66 426.05" stroke="#cbd1cd" stroke-width="3" fill="none"/><circle cx="66" cy="279.05" r="11" fill="#a36b42"/><text x="98" y="287.1" font-size="26" fill="#a36b42" font-weight="600">2025.06.10｜36GB 12 層</text><text x="98" y="336.1" font-size="32" fill="#263c46" font-weight="600">向多家關鍵客戶送樣</text><text x="98" y="385.7" font-size="26" fill="#59615e" font-weight="400">公告規劃 2026 年量產；此時量產屬預期。</text><path d="M66 451.95000000000005L66 621.95" stroke="#cbd1cd" stroke-width="3" fill="none"/><circle cx="66" cy="474.95000000000005" r="11" fill="#a36b42"/><text x="98" y="483.0" font-size="26" fill="#a36b42" font-weight="600">2026 第一季｜36GB 12 層</text><text x="98" y="532.0" font-size="32" fill="#263c46" font-weight="600">量產出貨開始</text><text x="98" y="581.6" font-size="26" fill="#59615e" font-weight="400">2026.03.16 公告確認已開始量產出貨；產品設計對應 </text><text x="98" y="621.9" font-size="26" fill="#59615e" font-weight="400">NVIDIA Vera Rubin。</text><path d="M66 688.1500000000001L66 858.1500000000001" stroke="#cbd1cd" stroke-width="3" fill="none"/><circle cx="66" cy="711.1500000000001" r="11" fill="#a36b42"/><text x="98" y="719.2" font-size="26" fill="#a36b42" font-weight="600">2026.03.16｜48GB 16 層</text><text x="98" y="768.2" font-size="32" fill="#263c46" font-weight="600">另一版本仍在送樣</text><text x="98" y="817.8" font-size="26" fill="#59615e" font-weight="400">同一份公告不能解讀為所有 HBM4 容量與堆疊版本都已</text><text x="98" y="858.1" font-size="26" fill="#59615e" font-weight="400">量產。</text><path d="M44 934.3500000000001L756 934.3500000000001" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="44" y="978.4" font-size="26" fill="#59615e" font-weight="400">仍未公開：每個客戶的驗收節點、個別成交價、專案毛利與回</text><text x="44" y="1018.7" font-size="26" fill="#59615e" font-weight="400">款。</text><text x="44" y="1059.0" font-size="26" fill="#59615e" font-weight="400">不能拼接不同產品或不同客戶的公告，宣稱單一專案已完成所</text><text x="44" y="1099.3" font-size="26" fill="#59615e" font-weight="400">有關卡。</text><path d="M44 1173.5500000000002L756 1173.5500000000002" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="44" y="1217.6" font-size="26" fill="#59615e" font-weight="400">事件以所列公告為證；不宣稱已覆蓋查核日前所有後續產品進</text><text x="44" y="1257.9" font-size="26" fill="#59615e" font-weight="400">展。</text><text x="44" y="1332.2" font-size="26" fill="#263c46" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="1377.2" font-size="26" fill="#59615e" font-weight="400">資料：Micron 官方公告 2025-06-10 [6]、2026-03-16 [7]｜整</text><text x="44" y="1417.5" font-size="26" fill="#59615e" font-weight="400">理：2026.10.19</text></g></svg>