<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1439" viewBox="0 0 800 1439" role="img"><title>apple-corning</title><rect width="800" height="1439" fill="#ffffff"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="52.0" font-size="26" fill="#a36b42" font-weight="600">產業研究  /  圖解</text><text x="44" y="118.0" font-size="42" fill="#202421" font-weight="600">資金承諾，和營運結果要分開讀</text><text x="44" y="183.1" font-size="29" fill="#59615e" font-weight="400">Apple × Corning｜2025 年 8 月 6 日公告的證據邊界</text><text x="44" y="266.1" font-size="26" fill="#a36b42" font-weight="600">已宣布安排</text><path d="M44 296.05L756 296.05" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="68" y="334.1" font-size="33" fill="#202421" font-weight="600">25 億美元的新承諾</text><text x="68" y="405.2" font-size="30" fill="#59615e" font-weight="400">在肯塔基州 Harrodsburg 生產所有 iPhone 與 </text><text x="68" y="451.7" font-size="30" fill="#59615e" font-weight="400">Apple Watch 蓋板玻璃。</text><text x="44" y="554.2" font-size="26" fill="#a36b42" font-weight="600">能力建設方向</text><path d="M44 584.2L756 584.2" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="68" y="622.2" font-size="33" fill="#202421" font-weight="600">製造、工程與共同創新</text><text x="68" y="693.4" font-size="30" fill="#59615e" font-weight="400">公告規劃人力擴充及共同創新中心；反映採用需要</text><text x="68" y="739.9" font-size="30" fill="#59615e" font-weight="400">材料以外的投入。</text><text x="44" y="842.4" font-size="26" fill="#a36b42" font-weight="600">尚不能確認</text><path d="M44 872.35L756 872.35" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="68" y="910.4" font-size="33" fill="#202421" font-weight="600">實際投入與經濟回報</text><text x="68" y="981.5" font-size="30" fill="#59615e" font-weight="400">不能由承諾額推算已付款、已完成轉移、單一客戶</text><text x="68" y="1028.0" font-size="30" fill="#59615e" font-weight="400">毛利或投資回收。</text><path d="M44 1130.5L756 1130.5" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="44" y="1174.5" font-size="26" fill="#59615e" font-weight="400">承諾與計畫以公告當時狀態表述；本文未取得專案後續獨立損</text><text x="44" y="1214.8" font-size="26" fill="#59615e" font-weight="400">益。</text><text x="44" y="1289.1" font-size="26" fill="#263c46" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="1334.1" font-size="26" fill="#59615e" font-weight="400">資料：Apple Newsroom，2025-08-06 [2]｜整理：2026.10.</text><text x="44" y="1374.4" font-size="26" fill="#59615e" font-weight="400">19</text></g></svg>