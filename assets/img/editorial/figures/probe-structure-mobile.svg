ont-size="33" fill="#202421" font-weight="600">晶圓接點</text><text x="68" y="1750.2" font-size="30" fill="#59615e" font-weight="400">接觸品質與元件量測共同確認。</text><path d="M44 1852.6500000000003L756 1852.6500000000003" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="44" y="1896.7" font-size="26" fill="#59615e" font-weight="400">非等比例剖面；線條表達功能連接，不代表實際導線或特定產</text><text x="44" y="1937.0" font-size="26" fill="#59615e" font-weight="400">品設計。</text><text x="44" y="2011.3" font-size="26" fill="#263c46" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="2056.2" font-size="26" fill="#59615e" font-weight="400">資料：Technoprobe、CHPT、JEM、MJC 公開資料 [2、3、5</text><text x="44" y="2096.6" font-size="26" fill="#59615e" font-weight="400">–7]｜整理：2026.10.19</text></g></svg>