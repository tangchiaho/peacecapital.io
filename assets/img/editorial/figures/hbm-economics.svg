<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1485" viewBox="0 0 1440 1485" role="img"><title>hbm-economics</title><rect width="1440" height="1485" fill="#ffffff"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="52.0" font-size="23" fill="#a36b42" font-weight="600">產業研究  /  圖解</text><text x="44" y="118.0" font-size="48" fill="#202421" font-weight="600">多一道測試，值不值得？</text><text x="44" y="192.4" font-size="28" fill="#59615e" font-weight="400">比較可避免的未來損失與新增代價；不是把測試次數愈多視為愈好。</text><path d="M480.0 388.8L960.0 388.8" stroke="#263c46" stroke-width="3" fill="none"/><path d="M720.0 388.8L720.0 618.8" stroke="#263c46" stroke-width="3" fill="none"/><path d="M655.0 618.8L720.0 538.8L785.0 618.8Z" fill="#dbe3dd" stroke="#263c46" stroke-width="3"/><path d="M510.0 388.8L510.0 503.8" stroke="#a36b42" stroke-width="3" fill="none"/><path d="M405.0 483.8Q510.0 573.8 615.0 483.8Z" fill="#eff2ee" stroke="#263c46" stroke-width="3"/><path d="M930.0 388.8L930.0 503.8" stroke="#a36b42" stroke-width="3" fill="none"/><path d="M825.0 483.8Q930.0 573.8 1035.0 483.8Z" fill="#eff2ee" stroke="#263c46" stroke-width="3"/><text x="460.0" y="336.8" font-size="30" fill="#263c46" font-weight="600">潛在收益</text><text x="850.0" y="336.8" font-size="30" fill="#263c46" font-weight="600">完整成本</text><rect x="44" y="688.8" width="240" height="164" rx="8" fill="#f0f2ef"/><text x="68" y="750.8" font-size="30" fill="#263c46" font-weight="600">收益</text><text x="320" y="730.8" font-size="32" fill="#263c46" font-weight="600">新增攔截缺陷 × 可避免後段成本</text><text x="320" y="783.8" font-size="28" fill="#59615e" font-weight="400">只計因提早攔截而省下的未來投入；先前已發生的晶粒成本不會倒退消失。</text><rect x="44" y="880.8" width="240" height="164" rx="8" fill="#f0f2ef"/><text x="68" y="942.8" font-size="30" fill="#263c46" font-weight="600">成本</text><text x="320" y="922.8" font-size="32" fill="#263c46" font-weight="600">測試 ＋ 維護 ＋ 產能與誤判代價</text><text x="320" y="975.8" font-size="28" fill="#59615e" font-weight="400">設備占用、介面磨耗、重測與誤判合格品等成本，都需納入。</text><rect x="44" y="1072.8" width="240" height="164" rx="8" fill="#f0f2ef"/><text x="68" y="1134.8" font-size="30" fill="#263c46" font-weight="600">驗證</text><text x="320" y="1114.8" font-size="32" fill="#263c46" font-weight="600">回到每單位合格產出</text><text x="320" y="1167.8" font-size="28" fill="#59615e" font-weight="400">以實際缺陷分布、覆蓋率與產能限制驗證；資料不足時先做小範圍對照。</text><path d="M44 1264.8L1396 1264.8" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="44" y="1308.8" font-size="25" fill="#59615e" font-weight="400">天平為比較概念，並非已計算的效益。買方測試需求，也不能直接換算某家供應商的獲利。</text><text x="44" y="1381.5" font-size="26" fill="#263c46" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="1426.5" font-size="22" fill="#59615e" font-weight="400">資料：FormFactor 先進封裝應用資料 [4]；本文增量分析｜整理：2026.10.19</text></g></svg>