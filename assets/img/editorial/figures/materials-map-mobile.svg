<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1818" viewBox="0 0 800 1818" role="img"><title>materials-map</title><rect width="800" height="1818" fill="#ffffff"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="52.0" font-size="26" fill="#a36b42" font-weight="600">產業研究  /  圖解</text><text x="44" y="118.0" font-size="42" fill="#202421" font-weight="600">材料價值，要跨過四種門檻</text><text x="44" y="183.1" font-size="29" fill="#59615e" font-weight="400">性能成立，只回答了第一個問題。量產與採購需要各自</text><text x="44" y="228.1" font-size="29" fill="#59615e" font-weight="400">的證據。</text><path d="M44.0 311.0L756.0 311.0" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="68.0" y="349.0" font-size="26" fill="#a36b42" font-weight="600">01</text><text x="68.0" y="388.0" font-size="33" fill="#202421" font-weight="600">性能</text><text x="68.0" y="459.1" font-size="30" fill="#59615e" font-weight="400">在指定環境下有效；與替代方案比較，記錄失效與</text><text x="68.0" y="505.6" font-size="30" fill="#59615e" font-weight="400">限制。</text><path d="M44.0 609.15L756.0 609.15" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="68.0" y="647.1" font-size="26" fill="#a36b42" font-weight="600">02</text><text x="68.0" y="686.1" font-size="33" fill="#202421" font-weight="600">製造</text><text x="68.0" y="757.3" font-size="30" fill="#59615e" font-weight="400">放大後仍有批次一致性；良率、加工與檢驗可重</text><text x="68.0" y="803.8" font-size="30" fill="#59615e" font-weight="400">複。</text><path d="M44.0 907.3L756.0 907.3" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="68.0" y="945.3" font-size="26" fill="#a36b42" font-weight="600">03</text><text x="68.0" y="984.3" font-size="33" fill="#202421" font-weight="600">買方接受</text><text x="68.0" y="1055.5" font-size="30" fill="#59615e" font-weight="400">驗證範圍、變更條件與責任明確；有採購安排可核</text><text x="68.0" y="1102.0" font-size="30" fill="#59615e" font-weight="400">對。</text><path d="M44.0 1205.4499999999998L756.0 1205.4499999999998" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="68.0" y="1243.4" font-size="26" fill="#a36b42" font-weight="600">04</text><text x="68.0" y="1282.4" font-size="33" fill="#202421" font-weight="600">持續供應</text><text x="68.0" y="1353.6" font-size="30" fill="#59615e" font-weight="400">交付與回款支持再投資；專用產能與集中風險可承</text><text x="68.0" y="1400.1" font-size="30" fill="#59615e" font-weight="400">擔。</text><path d="M44 1509.6L756 1509.6" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="44" y="1553.6" font-size="26" fill="#59615e" font-weight="400">本文分析框架；各關卡可平行、退回或重新驗證，非固定產業</text><text x="44" y="1593.9" font-size="26" fill="#59615e" font-weight="400">流程。</text><text x="44" y="1668.2" font-size="26" fill="#263c46" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="1713.2" font-size="26" fill="#59615e" font-weight="400">資料：Apple／Corning、Toray／Boeing 公告 [1–4]；NIST </text><text x="44" y="1753.5" font-size="26" fill="#59615e" font-weight="400">MGI [5]｜整理：2026.10.19</text></g></svg>