<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1439" viewBox="0 0 800 1439" role="img"><title>order-and-cash</title><rect width="800" height="1439" fill="#ffffff"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="52.0" font-size="26" fill="#a36b42" font-weight="600">產業研究  /  圖解</text><text x="44" y="118.0" font-size="42" fill="#202421" font-weight="600">看訂單，也要看資金壓在哪裡</text><text x="44" y="183.1" font-size="29" fill="#59615e" font-weight="400">把投入、履約與回收放在同一份專案紀錄中。</text><text x="44" y="266.1" font-size="26" fill="#a36b42" font-weight="600">投入</text><path d="M44 296.05L756 296.05" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="68" y="334.1" font-size="33" fill="#202421" font-weight="600">開發、驗證與設備</text><text x="68" y="405.2" font-size="30" fill="#59615e" font-weight="400">需要先支付哪些工作？投入能否轉用？哪些支出可</text><text x="68" y="451.7" font-size="30" fill="#59615e" font-weight="400">分階段決定？</text><text x="44" y="554.2" font-size="26" fill="#a36b42" font-weight="600">履約</text><path d="M44 584.2L756 584.2" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="68" y="622.2" font-size="33" fill="#202421" font-weight="600">備料、製造與交付</text><text x="68" y="693.4" font-size="30" fill="#59615e" font-weight="400">庫存、重工與需求延期由誰承擔？完整服務成本是</text><text x="68" y="739.9" font-size="30" fill="#59615e" font-weight="400">否已納入？</text><text x="44" y="842.4" font-size="26" fill="#a36b42" font-weight="600">回收</text><path d="M44 872.35L756 872.35" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="68" y="910.4" font-size="33" fill="#202421" font-weight="600">驗收、請款與付款</text><text x="68" y="981.5" font-size="30" fill="#59615e" font-weight="400">契約接受條件與時點是否清楚？延期情境下，資金</text><text x="68" y="1028.0" font-size="30" fill="#59615e" font-weight="400">緩衝是否足夠？</text><path d="M44 1130.5L756 1130.5" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="44" y="1174.5" font-size="26" fill="#59615e" font-weight="400">支出與收款可能交錯；不表示固定付款順序、實際金額或收入</text><text x="44" y="1214.8" font-size="26" fill="#59615e" font-weight="400">認列時點。</text><text x="44" y="1289.1" font-size="26" fill="#263c46" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="1334.1" font-size="26" fill="#59615e" font-weight="400">資料：本文商業模式與資金風險分析；分析框架非公司財務數</text><text x="44" y="1374.4" font-size="26" fill="#59615e" font-weight="400">據｜整理：2026.10.19</text></g></svg>