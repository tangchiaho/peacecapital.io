<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1539" viewBox="0 0 800 1539" role="img"><title>packaging-roles</title><rect width="800" height="1539" fill="#ffffff"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="52.0" font-size="26" fill="#a36b42" font-weight="600">產業研究  /  圖解</text><text x="44" y="118.0" font-size="42" fill="#202421" font-weight="600">一項整合產品，多種供應責任</text><text x="44" y="183.1" font-size="29" fill="#59615e" font-weight="400">設計、設備、材料與測試，圍繞可量產與交付的目標協</text><text x="44" y="228.1" font-size="29" fill="#59615e" font-weight="400">作。</text><path d="M400 791.0L400 461.0" stroke="#cbd1cd" stroke-width="3" fill="none"/><circle cx="400" cy="461.0" r="110" fill="#f0f3ef" stroke="#aab8ad" stroke-width="2"/><text x="368" y="458.0" font-size="32" fill="#263c46" font-weight="600">設計</text><text x="300" y="508.0" font-size="26" fill="#59615e" font-weight="400">功能・介面・功</text><text x="300" y="548.3" font-size="26" fill="#59615e" font-weight="400">耗</text><path d="M400 791.0L180 676.0" stroke="#cbd1cd" stroke-width="3" fill="none"/><circle cx="180" cy="676.0" r="110" fill="#f0f3ef" stroke="#aab8ad" stroke-width="2"/><text x="148" y="673.0" font-size="32" fill="#263c46" font-weight="600">設備</text><text x="80" y="723.0" font-size="26" fill="#59615e" font-weight="400">精度・節拍</text><path d="M400 791.0L620 676.0" stroke="#cbd1cd" stroke-width="3" fill="none"/><circle cx="620" cy="676.0" r="110" fill="#f0f3ef" stroke="#aab8ad" stroke-width="2"/><text x="588" y="673.0" font-size="32" fill="#263c46" font-weight="600">材料</text><text x="520" y="723.0" font-size="26" fill="#59615e" font-weight="400">加工・可靠度</text><path d="M400 791.0L400 1081.0" stroke="#cbd1cd" stroke-width="3" fill="none"/><circle cx="400" cy="1081.0" r="110" fill="#f0f3ef" stroke="#aab8ad" stroke-width="2"/><text x="368" y="1078.0" font-size="32" fill="#263c46" font-weight="600">測試</text><text x="300" y="1128.0" font-size="26" fill="#59615e" font-weight="400">功能・品質回饋</text><circle cx="400" cy="791.0" r="125" fill="#263c46"/><text x="336" y="781.0" font-size="32" fill="#fff" font-weight="600">封裝整合</text><text x="335" y="831.0" font-size="26" fill="#fff" font-weight="400">可製造・可交付</text><path d="M44 1271.0L756 1271.0" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="44" y="1315.0" font-size="26" fill="#59615e" font-weight="400">研究角色分類，非固定工序；同一家公司可能跨越多個角色。</text><text x="44" y="1389.3" font-size="26" fill="#263c46" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="1434.3" font-size="26" fill="#59615e" font-weight="400">資料：TSMC、ASE、Amkor、Henkel、ASMPT、Advantes</text><text x="44" y="1474.6" font-size="26" fill="#59615e" font-weight="400">t、FormFactor [1–7]｜整理：2026.10.19</text></g></svg>