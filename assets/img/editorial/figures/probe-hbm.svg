<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1171" viewBox="0 0 1440 1171" role="img"><title>probe-hbm</title><rect width="1440" height="1171" fill="#ffffff"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="52.0" font-size="23" fill="#a36b42" font-weight="600">產業研究  /  圖解</text><text x="44" y="118.0" font-size="48" fill="#202421" font-weight="600">測試對象改變，能回答的問題也改變</text><text x="44" y="192.4" font-size="28" fill="#59615e" font-weight="400">HBM｜晶粒合格，不等於堆疊連接已經確認。</text><path d="M44.0 273.8L706.0 273.8" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="68.0" y="311.8" font-size="23" fill="#a36b42" font-weight="600">01</text><text x="68.0" y="350.8" font-size="32" fill="#202421" font-weight="600">堆疊前：晶粒</text><text x="68.0" y="420.4" font-size="27" fill="#59615e" font-weight="400">確認該階段的晶粒電性與功能；不能提前篩出尚未</text><text x="68.0" y="462.2" font-size="27" fill="#59615e" font-weight="400">形成的組裝缺陷。</text><path d="M734.0 273.8L1396.0 273.8" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="758.0" y="311.8" font-size="23" fill="#a36b42" font-weight="600">02</text><text x="758.0" y="350.8" font-size="32" fill="#202421" font-weight="600">堆疊後：組合體</text><text x="758.0" y="420.4" font-size="27" fill="#59615e" font-weight="400">確認連接與整體表現；測試介面、溫度及覆蓋範圍</text><text x="758.0" y="462.2" font-size="27" fill="#59615e" font-weight="400">仍需說明。</text><rect x="44" y="567.1" width="240" height="164" rx="8" fill="#f0f2ef"/><text x="68" y="629.1" font-size="30" fill="#263c46" font-weight="600">KGD</text><text x="320" y="609.1" font-size="32" fill="#263c46" font-weight="600">Known Good Die</text><text x="320" y="662.1" font-size="28" fill="#59615e" font-weight="400">對象是晶粒；「合格」取決於當時執行的測試條件。</text><rect x="44" y="759.1" width="240" height="164" rx="8" fill="#f0f2ef"/><text x="68" y="821.1" font-size="30" fill="#263c46" font-weight="600">KGS</text><text x="320" y="801.1" font-size="32" fill="#263c46" font-weight="600">Known Good Stack</text><text x="320" y="854.1" font-size="28" fill="#59615e" font-weight="400">對象是堆疊；不代表客戶最終驗收與所有可靠度工作均已完成。</text><path d="M44 951.1L1396 951.1" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="44" y="995.1" font-size="25" fill="#59615e" font-weight="400">可選的測試位置與次數因產品而異；不是所有 HBM 世代的統一流程。</text><text x="44" y="1067.8" font-size="26" fill="#263c46" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="1112.8" font-size="22" fill="#59615e" font-weight="400">資料：FormFactor 技術簡報／KGD 文章 [8、9]｜整理：2026.10.19</text></g></svg>