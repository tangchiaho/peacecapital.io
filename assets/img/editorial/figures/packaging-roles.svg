<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1344" viewBox="0 0 1440 1344" role="img"><title>packaging-roles</title><rect width="1440" height="1344" fill="#ffffff"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="52.0" font-size="23" fill="#a36b42" font-weight="600">產業研究  /  圖解</text><text x="44" y="118.0" font-size="48" fill="#202421" font-weight="600">一項整合產品，多種供應責任</text><text x="44" y="192.4" font-size="28" fill="#59615e" font-weight="400">設計、設備、材料與測試，圍繞可量產與交付的目標協作。</text><path d="M720 683.8L720 413.8" stroke="#cbd1cd" stroke-width="3" fill="none"/><circle cx="720" cy="413.8" r="120" fill="#f0f3ef" stroke="#aab8ad" stroke-width="2"/><text x="688" y="410.8" font-size="32" fill="#263c46" font-weight="600">設計</text><text x="610" y="460.8" font-size="25" fill="#59615e" font-weight="400">功能・介面・功耗</text><path d="M720 683.8L270 683.8" stroke="#cbd1cd" stroke-width="3" fill="none"/><circle cx="270" cy="683.8" r="120" fill="#f0f3ef" stroke="#aab8ad" stroke-width="2"/><text x="238" y="680.8" font-size="32" fill="#263c46" font-weight="600">設備</text><text x="160" y="730.8" font-size="25" fill="#59615e" font-weight="400">精度・節拍</text><path d="M720 683.8L1170 683.8" stroke="#cbd1cd" stroke-width="3" fill="none"/><circle cx="1170" cy="683.8" r="120" fill="#f0f3ef" stroke="#aab8ad" stroke-width="2"/><text x="1138" y="680.8" font-size="32" fill="#263c46" font-weight="600">材料</text><text x="1060" y="730.8" font-size="25" fill="#59615e" font-weight="400">加工・可靠度</text><path d="M720 683.8L720 953.8" stroke="#cbd1cd" stroke-width="3" fill="none"/><circle cx="720" cy="953.8" r="120" fill="#f0f3ef" stroke="#aab8ad" stroke-width="2"/><text x="688" y="950.8" font-size="32" fill="#263c46" font-weight="600">測試</text><text x="610" y="1000.8" font-size="25" fill="#59615e" font-weight="400">功能・品質回饋</text><circle cx="720" cy="683.8" r="135" fill="#263c46"/><text x="656" y="673.8" font-size="32" fill="#fff" font-weight="600">封裝整合</text><text x="655" y="723.8" font-size="22" fill="#fff" font-weight="400">可製造・可交付</text><path d="M44 1123.8L1396 1123.8" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="44" y="1167.8" font-size="25" fill="#59615e" font-weight="400">研究角色分類，非固定工序；同一家公司可能跨越多個角色。</text><text x="44" y="1240.5" font-size="26" fill="#263c46" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="1285.5" font-size="22" fill="#59615e" font-weight="400">資料：TSMC、ASE、Amkor、Henkel、ASMPT、Advantest、FormFactor [1–7]｜整理：2026.10.19</text></g></svg>