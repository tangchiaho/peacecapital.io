<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1899" viewBox="0 0 800 1899" role="img"><title>hbm-economics</title><rect width="800" height="1899" fill="#ffffff"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="52.0" font-size="26" fill="#a36b42" font-weight="600">產業研究  /  圖解</text><text x="44" y="118.0" font-size="42" fill="#202421" font-weight="600">多一道測試，值不值得？</text><text x="44" y="183.1" font-size="29" fill="#59615e" font-weight="400">比較可避免的未來損失與新增代價；不是把測試次數愈</text><text x="44" y="228.1" font-size="29" fill="#59615e" font-weight="400">多視為愈好。</text><path d="M160.0 426.0L640.0 426.0" stroke="#263c46" stroke-width="3" fill="none"/><path d="M400.0 426.0L400.0 656.0" stroke="#263c46" stroke-width="3" fill="none"/><path d="M335.0 656.0L400.0 576.0L465.0 656.0Z" fill="#dbe3dd" stroke="#263c46" stroke-width="3"/><path d="M190.0 426.0L190.0 541.0" stroke="#a36b42" stroke-width="3" fill="none"/><path d="M85.0 521.0Q190.0 611.0 295.0 521.0Z" fill="#eff2ee" stroke="#263c46" stroke-width="3"/><path d="M610.0 426.0L610.0 541.0" stroke="#a36b42" stroke-width="3" fill="none"/><path d="M505.0 521.0Q610.0 611.0 715.0 521.0Z" fill="#eff2ee" stroke="#263c46" stroke-width="3"/><text x="140.0" y="374.0" font-size="30" fill="#263c46" font-weight="600">潛在收益</text><text x="530.0" y="374.0" font-size="30" fill="#263c46" font-weight="600">完整成本</text><text x="44" y="726.0" font-size="26" fill="#a36b42" font-weight="600">收益</text><path d="M44 756.0L756 756.0" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="68" y="794.0" font-size="33" fill="#202421" font-weight="600">新增攔截缺陷 × 可避免後段成本</text><text x="68" y="865.1" font-size="30" fill="#59615e" font-weight="400">只計因提早攔截而省下的未來投入；先前已發生的</text><text x="68" y="911.6" font-size="30" fill="#59615e" font-weight="400">晶粒成本不會倒退消失。</text><text x="44" y="1014.1" font-size="26" fill="#a36b42" font-weight="600">成本</text><path d="M44 1044.15L756 1044.15" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="68" y="1082.2" font-size="33" fill="#202421" font-weight="600">測試 ＋ 維護 ＋ 產能與誤判代價</text><text x="68" y="1153.3" font-size="30" fill="#59615e" font-weight="400">設備占用、介面磨耗、重測與誤判合格品等成本，</text><text x="68" y="1199.8" font-size="30" fill="#59615e" font-weight="400">都需納入。</text><text x="44" y="1302.3" font-size="26" fill="#a36b42" font-weight="600">驗證</text><path d="M44 1332.3000000000002L756 1332.3000000000002" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="68" y="1370.3" font-size="33" fill="#202421" font-weight="600">回到每單位合格產出</text><text x="68" y="1441.5" font-size="30" fill="#59615e" font-weight="400">以實際缺陷分布、覆蓋率與產能限制驗證；資料不</text><text x="68" y="1488.0" font-size="30" fill="#59615e" font-weight="400">足時先做小範圍對照。</text><path d="M44 1590.4500000000003L756 1590.4500000000003" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="44" y="1634.5" font-size="26" fill="#59615e" font-weight="400">天平為比較概念，並非已計算的效益。買方測試需求，也不能</text><text x="44" y="1674.8" font-size="26" fill="#59615e" font-weight="400">直接換算某家供應商的獲利。</text><text x="44" y="1749.1" font-size="26" fill="#263c46" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="1794.1" font-size="26" fill="#59615e" font-weight="400">資料：FormFactor 先進封裝應用資料 [4]；本文增量分析｜整</text><text x="44" y="1834.4" font-size="26" fill="#59615e" font-weight="400">理：2026.10.19</text></g></svg>