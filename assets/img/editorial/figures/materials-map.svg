<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1075" viewBox="0 0 1440 1075" role="img"><title>materials-map</title><rect width="1440" height="1075" fill="#ffffff"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="52.0" font-size="23" fill="#a36b42" font-weight="600">產業研究  /  圖解</text><text x="44" y="118.0" font-size="48" fill="#202421" font-weight="600">材料價值，要跨過四種門檻</text><text x="44" y="192.4" font-size="28" fill="#59615e" font-weight="400">性能成立，只回答了第一個問題。量產與採購需要各自的證據。</text><path d="M44.0 273.8L706.0 273.8" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="68.0" y="311.8" font-size="23" fill="#a36b42" font-weight="600">01</text><text x="68.0" y="350.8" font-size="32" fill="#202421" font-weight="600">性能</text><text x="68.0" y="420.4" font-size="27" fill="#59615e" font-weight="400">在指定環境下有效；與替代方案比較，記錄失效與</text><text x="68.0" y="462.2" font-size="27" fill="#59615e" font-weight="400">限制。</text><path d="M734.0 273.8L1396.0 273.8" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="758.0" y="311.8" font-size="23" fill="#a36b42" font-weight="600">02</text><text x="758.0" y="350.8" font-size="32" fill="#202421" font-weight="600">製造</text><text x="758.0" y="420.4" font-size="27" fill="#59615e" font-weight="400">放大後仍有批次一致性；良率、加工與檢驗可重</text><text x="758.0" y="462.2" font-size="27" fill="#59615e" font-weight="400">複。</text><path d="M44.0 561.1L706.0 561.1" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="68.0" y="599.1" font-size="23" fill="#a36b42" font-weight="600">03</text><text x="68.0" y="638.1" font-size="32" fill="#202421" font-weight="600">買方接受</text><text x="68.0" y="707.7" font-size="27" fill="#59615e" font-weight="400">驗證範圍、變更條件與責任明確；有採購安排可核</text><text x="68.0" y="749.6" font-size="27" fill="#59615e" font-weight="400">對。</text><path d="M734.0 561.1L1396.0 561.1" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="758.0" y="599.1" font-size="23" fill="#a36b42" font-weight="600">04</text><text x="758.0" y="638.1" font-size="32" fill="#202421" font-weight="600">持續供應</text><text x="758.0" y="707.7" font-size="27" fill="#59615e" font-weight="400">交付與回款支持再投資；專用產能與集中風險可承</text><text x="758.0" y="749.6" font-size="27" fill="#59615e" font-weight="400">擔。</text><path d="M44 854.4000000000001L1396 854.4000000000001" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="44" y="898.4" font-size="25" fill="#59615e" font-weight="400">本文分析框架；各關卡可平行、退回或重新驗證，非固定產業流程。</text><text x="44" y="971.2" font-size="26" fill="#263c46" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="1016.2" font-size="22" fill="#59615e" font-weight="400">資料：Apple／Corning、Toray／Boeing 公告 [1–4]；NIST MGI [5]｜整理：2026.10.19</text></g></svg>