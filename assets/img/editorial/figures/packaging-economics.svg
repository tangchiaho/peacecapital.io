<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="931" viewBox="0 0 1440 931" role="img"><title>packaging-economics</title><rect width="1440" height="931" fill="#ffffff"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="52.0" font-size="23" fill="#a36b42" font-weight="600">產業研究  /  圖解</text><text x="44" y="118.0" font-size="48" fill="#202421" font-weight="600">產業機會，要沿不同收入路徑追蹤</text><text x="44" y="192.4" font-size="28" fill="#59615e" font-weight="400">設備、材料與整合服務，交付內容和資金風險不同。</text><rect x="44" y="273.8" width="1352" height="66" rx="8" fill="#263c46"/><text x="62" y="316.8" font-size="28" fill="#fff" font-weight="600">角色</text><text x="302" y="316.8" font-size="28" fill="#fff" font-weight="600">應核對的交付證據</text><text x="858.0" y="316.8" font-size="28" fill="#fff" font-weight="600">資金與風險</text><rect x="44" y="339.8" width="1352" height="80.3" rx="0" fill="#f0f2ef"/><text x="62" y="377.8" font-size="26" fill="#263c46" font-weight="600">設備</text><text x="302" y="377.8" font-size="26" fill="#59615e" font-weight="400">訂單、出貨與依契約驗收；檢查客戶實際使用</text><text x="858.0" y="377.8" font-size="26" fill="#59615e" font-weight="400">研發、存貨、安裝與回款；擴產訂單可能遞延</text><rect x="44" y="423.1" width="1352" height="120.6" rx="0" fill="#eceee6"/><text x="62" y="461.1" font-size="26" fill="#263c46" font-weight="600">材料</text><text x="302" y="461.1" font-size="26" fill="#59615e" font-weight="400">指定製程接受、批次穩定與重複出貨</text><text x="858.0" y="461.1" font-size="26" fill="#59615e" font-weight="400">專用產能、批次報廢與集中度；用量不等於利</text><text x="858.0" y="501.4" font-size="26" fill="#59615e" font-weight="400">潤</text><rect x="44" y="546.7" width="1352" height="120.6" rx="0" fill="#f0f2ef"/><text x="62" y="584.7" font-size="26" fill="#263c46" font-weight="600">整合服務</text><text x="302" y="584.7" font-size="26" fill="#59615e" font-weight="400">可用產出、良率與交付；需求與產能配合</text><text x="858.0" y="584.7" font-size="26" fill="#59615e" font-weight="400">設備與人力先投入；稼動、重工與折舊影響回</text><text x="858.0" y="625.0" font-size="26" fill="#59615e" font-weight="400">收</text><path d="M44 710.3000000000001L1396 710.3000000000001" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="44" y="754.3" font-size="25" fill="#59615e" font-weight="400">交付檢查表不是統一收入認列規則；公司會計政策與契約條件須另外核對。</text><text x="44" y="827.1" font-size="26" fill="#263c46" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="872.1" font-size="22" fill="#59615e" font-weight="400">資料：各角色官方產品資料 [1–7]；本文經營與投資分析｜整理：2026.10.19</text></g></svg>