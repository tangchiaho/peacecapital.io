<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1278" viewBox="0 0 1440 1278" role="img"><title>probe-partnerships</title><rect width="1440" height="1278" fill="#ffffff"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="52.0" font-size="23" fill="#a36b42" font-weight="600">產業研究  /  圖解</text><text x="44" y="118.0" font-size="48" fill="#202421" font-weight="600">合作公告，先讀交易狀態與分工</text><text x="44" y="192.4" font-size="28" fill="#59615e" font-weight="400">股權、技術協作與採購安排，代表不同層次的證據。</text><path d="M66 263.8L66 433.8" stroke="#cbd1cd" stroke-width="3" fill="none"/><circle cx="66" cy="286.8" r="11" fill="#a36b42"/><text x="98" y="294.8" font-size="26" fill="#a36b42" font-weight="600">2024.05｜已完成</text><text x="98" y="343.8" font-size="32" fill="#263c46" font-weight="600">Teradyne × Technoprobe</text><text x="98" y="393.4" font-size="26" fill="#59615e" font-weight="400">當時股權投資與 DIS 業務交易完成；歷史比例不等於目前持股。</text><path d="M66 459.70000000000005L66 629.7" stroke="#cbd1cd" stroke-width="3" fill="none"/><circle cx="66" cy="482.70000000000005" r="11" fill="#a36b42"/><text x="98" y="490.7" font-size="26" fill="#a36b42" font-weight="600">2025.01｜公告投資與協作</text><text x="98" y="539.7" font-size="32" fill="#263c46" font-weight="600">Advantest × 兩家介面供應商</text><text x="98" y="589.3" font-size="26" fill="#59615e" font-weight="400">少數股權與生態合作，不能推定獨家供應或保證訂單。</text><path d="M66 655.6L66 825.6" stroke="#cbd1cd" stroke-width="3" fill="none"/><circle cx="66" cy="678.6" r="11" fill="#a36b42"/><text x="98" y="686.6" font-size="26" fill="#a36b42" font-weight="600">2025.12｜協議分工</text><text x="98" y="735.6" font-size="32" fill="#263c46" font-weight="600">Technoprobe × WinWay × MS SUN</text><text x="98" y="785.2" font-size="26" fill="#59615e" font-weight="400">技術、智財、整合與採購各有責任；最低採購安排不等於已認列收入。</text><path d="M66 851.5L66 1021.5" stroke="#cbd1cd" stroke-width="3" fill="none"/><circle cx="66" cy="874.5" r="11" fill="#a36b42"/><text x="98" y="882.5" font-size="26" fill="#a36b42" font-weight="600">2026.10｜協議待完成條件</text><text x="98" y="931.5" font-size="32" fill="#263c46" font-weight="600">FormFactor × Teradyne</text><text x="98" y="981.1" font-size="26" fill="#59615e" font-weight="400">3 億美元股權安排仍有交割條件；公告與已完成投資分開。</text><path d="M44 1057.4L1396 1057.4" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="44" y="1101.4" font-size="25" fill="#59615e" font-weight="400">以來源所述事件狀態整理；不推論未揭露的售價、毛利、採購排他或已完成交割。</text><text x="44" y="1174.2" font-size="26" fill="#263c46" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="1219.2" font-size="22" fill="#59615e" font-weight="400">資料：Teradyne SEC [11]；Advantest [13]；FormFactor／SEC [14、18]；Technoprobe [17]｜整理：2026.10.19</text></g></svg>