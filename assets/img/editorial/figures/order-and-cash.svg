<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1070" viewBox="0 0 1440 1070" role="img"><title>order-and-cash</title><rect width="1440" height="1070" fill="#ffffff"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="52.0" font-size="23" fill="#a36b42" font-weight="600">產業研究  /  圖解</text><text x="44" y="118.0" font-size="48" fill="#202421" font-weight="600">看訂單，也要看資金壓在哪裡</text><text x="44" y="192.4" font-size="28" fill="#59615e" font-weight="400">把投入、履約與回收放在同一份專案紀錄中。</text><rect x="44" y="273.8" width="240" height="164" rx="8" fill="#f0f2ef"/><text x="68" y="335.8" font-size="30" fill="#263c46" font-weight="600">投入</text><text x="320" y="315.8" font-size="32" fill="#263c46" font-weight="600">開發、驗證與設備</text><text x="320" y="368.8" font-size="28" fill="#59615e" font-weight="400">需要先支付哪些工作？投入能否轉用？哪些支出可分階段決定？</text><rect x="44" y="465.8" width="240" height="164" rx="8" fill="#f0f2ef"/><text x="68" y="527.8" font-size="30" fill="#263c46" font-weight="600">履約</text><text x="320" y="507.8" font-size="32" fill="#263c46" font-weight="600">備料、製造與交付</text><text x="320" y="560.8" font-size="28" fill="#59615e" font-weight="400">庫存、重工與需求延期由誰承擔？完整服務成本是否已納入？</text><rect x="44" y="657.8" width="240" height="164" rx="8" fill="#f0f2ef"/><text x="68" y="719.8" font-size="30" fill="#263c46" font-weight="600">回收</text><text x="320" y="699.8" font-size="32" fill="#263c46" font-weight="600">驗收、請款與付款</text><text x="320" y="752.8" font-size="28" fill="#59615e" font-weight="400">契約接受條件與時點是否清楚？延期情境下，資金緩衝是否足夠？</text><path d="M44 849.8L1396 849.8" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="44" y="893.8" font-size="25" fill="#59615e" font-weight="400">支出與收款可能交錯；不表示固定付款順序、實際金額或收入認列時點。</text><text x="44" y="966.5" font-size="26" fill="#263c46" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="1011.5" font-size="22" fill="#59615e" font-weight="400">資料：本文商業模式與資金風險分析；分析框架非公司財務數據｜整理：2026.10.19</text></g></svg>