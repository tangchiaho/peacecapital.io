<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1587" viewBox="0 0 800 1587" role="img"><title>probe-roles</title><rect width="800" height="1587" fill="#ffffff"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="52.0" font-size="26" fill="#a36b42" font-weight="600">產業研究  /  圖解</text><text x="44" y="118.0" font-size="42" fill="#202421" font-weight="600">一場晶圓測試，三種不同工作</text><text x="44" y="183.1" font-size="29" fill="#59615e" font-weight="400">訊號判斷、接觸介面與位置控制要協同。</text><path d="M44.0 266.05L756.0 266.05" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="68.0" y="304.1" font-size="26" fill="#a36b42" font-weight="600">01</text><text x="68.0" y="343.1" font-size="33" fill="#202421" font-weight="600">ATE 測試機</text><text x="68.0" y="414.2" font-size="30" fill="#59615e" font-weight="400">提供測試訊號、量測回應，依條件判定結果。</text><path d="M44.0 517.7L756.0 517.7" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="68.0" y="555.7" font-size="26" fill="#a36b42" font-weight="600">02</text><text x="68.0" y="594.7" font-size="33" fill="#202421" font-weight="600">探針卡</text><text x="68.0" y="665.9" font-size="30" fill="#59615e" font-weight="400">把測試機與晶圓接點連接；電性與機械條件共同影</text><text x="68.0" y="712.4" font-size="30" fill="#59615e" font-weight="400">響接觸。</text><path d="M44.0 815.85L756.0 815.85" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="68.0" y="853.9" font-size="26" fill="#a36b42" font-weight="600">03</text><text x="68.0" y="892.9" font-size="33" fill="#202421" font-weight="600">Prober 探針台</text><text x="68.0" y="964.0" font-size="30" fill="#59615e" font-weight="400">控制晶圓位置、對準與接觸動作；配合測試方案運</text><text x="68.0" y="1010.5" font-size="30" fill="#59615e" font-weight="400">作。</text><path d="M44 1120.0L756 1120.0" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="44" y="1164.0" font-size="26" fill="#59615e" font-weight="400">電性路徑：測試機 ⇄ 探針卡 ⇄ 晶圓接點</text><text x="44" y="1204.3" font-size="26" fill="#59615e" font-weight="400">機械配合：探針台定位與接觸控制</text><path d="M44 1278.6L756 1278.6" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="44" y="1322.6" font-size="26" fill="#59615e" font-weight="400">功能概念示意，非設備接線圖；實際系統組成依產品與測試配</text><text x="44" y="1362.9" font-size="26" fill="#59615e" font-weight="400">置而異。</text><text x="44" y="1437.2" font-size="26" fill="#263c46" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="1482.2" font-size="26" fill="#59615e" font-weight="400">資料：JEM、Technoprobe、CHPT 產品說明 [1–3]｜整理：</text><text x="44" y="1522.5" font-size="26" fill="#59615e" font-weight="400">2026.10.19</text></g></svg>