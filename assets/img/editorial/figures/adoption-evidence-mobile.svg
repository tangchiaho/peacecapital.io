<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1475" viewBox="0 0 800 1475" role="img"><title>adoption-evidence</title><rect width="800" height="1475" fill="#ffffff"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="52.0" font-size="26" fill="#a36b42" font-weight="600">產業研究  /  圖解</text><text x="44" y="118.0" font-size="42" fill="#202421" font-weight="600">測試通過之後，還要回答什麼？</text><text x="44" y="183.1" font-size="29" fill="#59615e" font-weight="400">三種不同的證據，可以平行補強；不是共同認證制度。</text><path d="M44.0 266.05L756.0 266.05" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="68.0" y="304.1" font-size="26" fill="#a36b42" font-weight="600">01</text><text x="68.0" y="343.1" font-size="33" fill="#202421" font-weight="600">技術可行</text><text x="68.0" y="414.2" font-size="30" fill="#59615e" font-weight="400">試片與測試報告，界定牌號、方法與測試條件的性</text><text x="68.0" y="460.7" font-size="30" fill="#59615e" font-weight="400">能範圍。</text><path d="M44.0 564.2L756.0 564.2" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="68.0" y="602.2" font-size="26" fill="#a36b42" font-weight="600">02</text><text x="68.0" y="641.2" font-size="33" fill="#202421" font-weight="600">客戶可用</text><text x="68.0" y="712.4" font-size="30" fill="#59615e" font-weight="400">零件、加工窗口與跨批次結果，確認能否放進指定</text><text x="68.0" y="758.9" font-size="30" fill="#59615e" font-weight="400">產線。</text><path d="M44.0 862.35L756.0 862.35" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="68.0" y="900.4" font-size="26" fill="#a36b42" font-weight="600">03</text><text x="68.0" y="939.4" font-size="33" fill="#202421" font-weight="600">生意可持續</text><text x="68.0" y="1010.5" font-size="30" fill="#59615e" font-weight="400">交付、重複採購與回款，連同服務及資本投入評</text><text x="68.0" y="1057.0" font-size="30" fill="#59615e" font-weight="400">估。</text><path d="M44 1166.5L756 1166.5" stroke="#cbd1cd" stroke-width="3" fill="none"/><text x="44" y="1210.5" font-size="26" fill="#59615e" font-weight="400">各項進展可能不同步；材料名稱、製程或配置改變時，原有證</text><text x="44" y="1250.8" font-size="26" fill="#59615e" font-weight="400">據的適用範圍需重新核對。</text><text x="44" y="1325.1" font-size="26" fill="#263c46" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="1370.1" font-size="26" fill="#59615e" font-weight="400">資料：UL、BASF、Toray／NCAMP；本文案例與研究問題 [1–</text><text x="44" y="1410.4" font-size="26" fill="#59615e" font-weight="400">4]｜整理：2026.10.19</text></g></svg>