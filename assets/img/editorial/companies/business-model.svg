<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930"><title>Technoprobe：從客製測試需求到量產收入</title><rect width="1400" height="930" fill="#ffffff"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="58" font-size="25" fill="#a36b42" font-weight="600">公司研究  /  TECHNOPROBE</text><text x="44" y="125" font-size="52" fill="#202421" font-weight="600">把晶片的不同，做成測試介面</text><text x="44" y="177" font-size="29" fill="#59615e" font-weight="400">技術價值要經過設計採用、穩定交付，才能形成收入。</text><rect x="44" y="235" width="410" height="240" rx="8" fill="#e4eae2"/><text x="70" y="283" font-size="29" fill="#a36b42" font-weight="600">01</text><text x="70" y="353" font-size="37" fill="#202421" font-weight="600">客製測試需求</text><text x="70" y="417" font-size="25" fill="#202421" font-weight="400">接點配置・電性・使用條件</text><path d="M460 355h26m-8-8 8 8-8 8" fill="none" stroke="#a36b42" stroke-width="3"/><rect x="494" y="235" width="410" height="240" rx="8" fill="#263c46"/><text x="520" y="283" font-size="29" fill="#e6c296" font-weight="600">02</text><text x="520" y="353" font-size="37" fill="#fff" font-weight="600">設計與精密製造</text><text x="520" y="417" font-size="25" fill="#fff" font-weight="400">探針・介面板・機械整合</text><path d="M910 355h26m-8-8 8 8-8 8" fill="none" stroke="#a36b42" stroke-width="3"/><rect x="944" y="235" width="410" height="240" rx="8" fill="#e4eae2"/><text x="970" y="283" font-size="29" fill="#a36b42" font-weight="600">03</text><text x="970" y="353" font-size="37" fill="#202421" font-weight="600">客戶採用與量產</text><text x="970" y="417" font-size="25" fill="#202421" font-weight="400">交付・支援・生命週期</text><text x="44" y="555" font-size="34" fill="#202421" font-weight="600">從產品能力，到收入品質</text><text x="44" y="627" font-size="31" fill="#a36b42" font-weight="600">需求能否延續？</text><text x="44" y="682" font-size="27" fill="#59615e" font-weight="400">新設計、出貨與替換需求</text><text x="494" y="627" font-size="31" fill="#a36b42" font-weight="600">投入能否重用？</text><text x="494" y="682" font-size="27" fill="#59615e" font-weight="400">客製研發與製造經驗</text><text x="944" y="627" font-size="31" fill="#a36b42" font-weight="600">交付能否收現？</text><text x="944" y="682" font-size="27" fill="#59615e" font-weight="400">驗收、售後成本與回款</text><text x="44" y="752" font-size="25" fill="#59615e" font-weight="400">分析框架；不代表固定收費方式、採購頻率或已保證的訂單。</text><path d="M44 826H1356" stroke="#b5c2b6"/><text x="44" y="867" font-size="26" fill="#263c46" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="906" font-size="24" fill="#59615e" font-weight="400">資料：Technoprobe 產品／技術公開資料；2026.10.18 整理</text></g></svg>