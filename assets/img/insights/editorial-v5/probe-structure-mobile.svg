<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1303" viewBox="0 0 800 1303" role="img"><title>probe-structure</title><rect width="800" height="1303" fill="#f5f3ed"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="52.0" font-size="26" fill="#a46e3d" font-weight="600">PEACE CAPITAL  /  產業研究</text><text x="44" y="118.0" font-size="42" fill="#203b35" font-weight="600">探針卡：把訊號帶到微小接點</text><text x="44" y="183.1" font-size="29" fill="#56655e" font-weight="400">分層功能示意｜精密接觸只是整個介面的一部分</text><rect x="100" y="266.05" width="600" height="105" rx="3" fill="#244e42"/><text x="124" y="309.1" font-size="30" fill="#fff" font-weight="600">電路板與訊號路徑</text><text x="124" y="350.1" font-size="26" fill="#fff" font-weight="400">訊號完整性、電源與散熱配置</text><path d="M220.0 378.05L220.0 429.05" stroke="#a46e3d" stroke-width="3" fill="none"/><path d="M400.0 378.05L400.0 429.05" stroke="#a46e3d" stroke-width="3" fill="none"/><path d="M580.0 378.05L580.0 429.05" stroke="#a46e3d" stroke-width="3" fill="none"/><rect x="100" y="448.05" width="600" height="105" rx="3" fill="#a46e3d"/><text x="124" y="491.1" font-size="30" fill="#fff" font-weight="600">轉接／空間轉換結構</text><text x="124" y="532.0" font-size="26" fill="#fff" font-weight="400">將不同尺度的接點配置連接</text><path d="M220.0 560.05L220.0 611.05" stroke="#a46e3d" stroke-width="3" fill="none"/><path d="M400.0 560.05L400.0 611.05" stroke="#a46e3d" stroke-width="3" fill="none"/><path d="M580.0 560.05L580.0 611.05" stroke="#a46e3d" stroke-width="3" fill="none"/><rect x="100" y="630.05" width="600" height="105" rx="3" fill="#244e42"/><text x="124" y="673.0" font-size="30" fill="#fff" font-weight="600">探針頭與接觸元件</text><text x="124" y="714.0" font-size="26" fill="#fff" font-weight="400">位置、接觸力、磨耗與清潔</text><path d="M220.0 742.05L220.0 793.05" stroke="#a46e3d" stroke-width="3" fill="none"/><path d="M400.0 742.05L400.0 793.05" stroke="#a46e3d" stroke-width="3" fill="none"/><path d="M580.0 742.05L580.0 793.05" stroke="#a46e3d" stroke-width="3" fill="none"/><rect x="100" y="812.05" width="600" height="105" rx="3" fill="#56655e"/><text x="124" y="855.0" font-size="30" fill="#fff" font-weight="600">晶圓接點</text><text x="124" y="896.0" font-size="26" fill="#fff" font-weight="400">接觸品質與元件量測共同確認</text><path d="M44 994.05L756 994.05" stroke="#b5c2b6" stroke-width="3" fill="none"/><text x="44" y="1038.0" font-size="26" fill="#56655e" font-weight="400">非等比例剖面；不同架構未必含相同部件。MEMS 是製作技</text><text x="44" y="1078.3" font-size="26" fill="#56655e" font-weight="400">術，不能與探針排列方式直接互斥比較。</text><text x="44" y="1152.6" font-size="26" fill="#244e42" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="1197.6" font-size="26" fill="#56655e" font-weight="400">資料：Technoprobe、CHPT、JEM、MJC 公開資料 [2、3、5</text><text x="44" y="1237.9" font-size="26" fill="#56655e" font-weight="400">–7]｜整理：2026.10.19</text></g></svg>