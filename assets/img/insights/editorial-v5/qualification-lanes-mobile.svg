<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1439" viewBox="0 0 800 1439" role="img"><title>qualification-lanes</title><rect width="800" height="1439" fill="#f5f3ed"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="52.0" font-size="26" fill="#a46e3d" font-weight="600">PEACE CAPITAL  /  產業研究</text><text x="44" y="118.0" font-size="42" fill="#203b35" font-weight="600">產品、客戶與經濟結果：三條線</text><text x="44" y="183.1" font-size="29" fill="#56655e" font-weight="400">研究時分開記錄，才能找到真正卡住的環節。</text><text x="44" y="266.1" font-size="26" fill="#a46e3d" font-weight="600">產品線</text><rect x="44" y="296.05" width="712" height="226.15" rx="8" fill="#e2e9e0"/><text x="68" y="334.1" font-size="33" fill="#203b35" font-weight="600">可銷售、可供應</text><text x="68" y="405.2" font-size="30" fill="#56655e" font-weight="400">產品版本、品質狀態與產能；TI 的 ACTIVE 是產品</text><text x="68" y="451.7" font-size="30" fill="#56655e" font-weight="400">狀態，非某位買方的認可。</text><text x="44" y="554.2" font-size="26" fill="#a46e3d" font-weight="600">客戶線</text><rect x="44" y="584.2" width="712" height="226.15" rx="8" fill="#244e42"/><text x="68" y="622.2" font-size="33" fill="#fff" font-weight="600">測試、採用與交付</text><text x="68" y="693.4" font-size="30" fill="#fff" font-weight="400">特定平台、驗收項目與變更限制；同一產品可能在</text><text x="68" y="739.9" font-size="30" fill="#fff" font-weight="400">不同客戶進度不同。</text><text x="44" y="842.4" font-size="26" fill="#a46e3d" font-weight="600">經濟線</text><rect x="44" y="872.35" width="712" height="226.15" rx="8" fill="#e2e9e0"/><text x="68" y="910.4" font-size="33" fill="#203b35" font-weight="600">收入、成本與回款</text><text x="68" y="981.5" font-size="30" fill="#56655e" font-weight="400">交付不等於高毛利；工程、重工、庫存與帳期共同</text><text x="68" y="1028.0" font-size="30" fill="#56655e" font-weight="400">影響投資回收。</text><path d="M44 1130.5L756 1130.5" stroke="#b5c2b6" stroke-width="3" fill="none"/><text x="44" y="1174.5" font-size="26" fill="#56655e" font-weight="400">三條線可平行推進或退回；不是供應商公告名稱的通用認證等</text><text x="44" y="1214.8" font-size="26" fill="#56655e" font-weight="400">級。</text><text x="44" y="1289.1" font-size="26" fill="#244e42" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="1334.1" font-size="26" fill="#56655e" font-weight="400">資料：TI 產品生命週期 [2]；FormFactor 年報／公告 [1、3、</text><text x="44" y="1374.4" font-size="26" fill="#56655e" font-weight="400">4]；本文分類｜整理：2026.10.19</text></g></svg>