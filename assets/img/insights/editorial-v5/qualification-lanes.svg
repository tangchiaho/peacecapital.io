<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1070" viewBox="0 0 1440 1070" role="img"><title>qualification-lanes</title><rect width="1440" height="1070" fill="#f5f3ed"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="52.0" font-size="23" fill="#a46e3d" font-weight="600">PEACE CAPITAL  /  產業研究</text><text x="44" y="118.0" font-size="48" fill="#203b35" font-weight="600">產品、客戶與經濟結果：三條線</text><text x="44" y="192.4" font-size="28" fill="#56655e" font-weight="400">研究時分開記錄，才能找到真正卡住的環節。</text><rect x="44" y="273.8" width="240" height="164" rx="8" fill="#e2e9e0"/><text x="68" y="335.8" font-size="30" fill="#244e42" font-weight="600">產品線</text><text x="320" y="315.8" font-size="32" fill="#244e42" font-weight="600">可銷售、可供應</text><text x="320" y="368.8" font-size="28" fill="#56655e" font-weight="400">產品版本、品質狀態與產能；TI 的 ACTIVE 是產品狀態，非某位買方的認可。</text><rect x="44" y="465.8" width="240" height="164" rx="8" fill="#244e42"/><text x="68" y="527.8" font-size="30" fill="#fff" font-weight="600">客戶線</text><text x="320" y="507.8" font-size="32" fill="#244e42" font-weight="600">測試、採用與交付</text><text x="320" y="560.8" font-size="28" fill="#56655e" font-weight="400">特定平台、驗收項目與變更限制；同一產品可能在不同客戶進度不同。</text><rect x="44" y="657.8" width="240" height="164" rx="8" fill="#e2e9e0"/><text x="68" y="719.8" font-size="30" fill="#244e42" font-weight="600">經濟線</text><text x="320" y="699.8" font-size="32" fill="#244e42" font-weight="600">收入、成本與回款</text><text x="320" y="752.8" font-size="28" fill="#56655e" font-weight="400">交付不等於高毛利；工程、重工、庫存與帳期共同影響投資回收。</text><path d="M44 849.8L1396 849.8" stroke="#b5c2b6" stroke-width="3" fill="none"/><text x="44" y="893.8" font-size="25" fill="#56655e" font-weight="400">三條線可平行推進或退回；不是供應商公告名稱的通用認證等級。</text><text x="44" y="966.5" font-size="26" fill="#244e42" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="1011.5" font-size="22" fill="#56655e" font-weight="400">資料：TI 產品生命週期 [2]；FormFactor 年報／公告 [1、3、4]；本文分類｜整理：2026.10.19</text></g></svg>