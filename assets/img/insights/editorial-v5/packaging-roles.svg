<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1244" viewBox="0 0 1440 1244" role="img"><title>packaging-roles</title><rect width="1440" height="1244" fill="#f5f3ed"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="52.0" font-size="23" fill="#a46e3d" font-weight="600">PEACE CAPITAL  /  產業研究</text><text x="44" y="118.0" font-size="48" fill="#203b35" font-weight="600">先進封裝：一項產品，多種責任</text><text x="44" y="192.4" font-size="28" fill="#56655e" font-weight="400">角色關係圖｜同一家公司可能跨越多個角色。</text><rect x="450" y="273.8" width="540" height="215.3" rx="8" fill="#244e42"/><text x="474" y="311.8" font-size="32" fill="#fff" font-weight="600">封裝與整合</text><text x="474" y="381.4" font-size="27" fill="#fff" font-weight="400">把產品要求轉為可製造、可交付的組合方</text><text x="474" y="423.2" font-size="27" fill="#fff" font-weight="400">案。</text><rect x="44" y="543.8" width="646" height="173.45" rx="8" fill="#e2e9e0"/><text x="68" y="581.8" font-size="32" fill="#203b35" font-weight="600">設計</text><text x="68" y="651.4" font-size="27" fill="#56655e" font-weight="400">功能、介面、功耗與散熱</text><rect x="750" y="543.8" width="646" height="173.45" rx="8" fill="#e2e9e0"/><text x="774" y="581.8" font-size="32" fill="#203b35" font-weight="600">設備</text><text x="774" y="651.4" font-size="27" fill="#56655e" font-weight="400">精度、節拍與可用產能</text><rect x="44" y="773.8" width="646" height="173.45" rx="8" fill="#e2e9e0"/><text x="68" y="811.8" font-size="32" fill="#203b35" font-weight="600">材料</text><text x="68" y="881.4" font-size="27" fill="#56655e" font-weight="400">加工窗口與可靠度</text><rect x="750" y="773.8" width="646" height="173.45" rx="8" fill="#e2e9e0"/><text x="774" y="811.8" font-size="32" fill="#203b35" font-weight="600">測試</text><text x="774" y="881.4" font-size="27" fill="#56655e" font-weight="400">功能確認與品質回饋</text><path d="M390 531.8L580 483.8" stroke="#a46e3d" stroke-width="3" fill="none"/><circle cx="580" cy="483.8" r="5" fill="#a46e3d"/><path d="M1040 531.8L860 483.8" stroke="#a46e3d" stroke-width="3" fill="none"/><circle cx="860" cy="483.8" r="5" fill="#a46e3d"/><path d="M44 1023.8L1396 1023.8" stroke="#b5c2b6" stroke-width="3" fill="none"/><text x="44" y="1067.8" font-size="25" fill="#56655e" font-weight="400">研究角色分類，非固定製程或排他企業名單；平台名稱與單一步驟不能直接比較。</text><text x="44" y="1140.5" font-size="26" fill="#244e42" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="1185.5" font-size="22" fill="#56655e" font-weight="400">資料：TSMC、ASE、Amkor、Henkel、ASMPT、Advantest、FormFactor [1–7]｜整理：2026.10.19</text></g></svg>