<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1643" viewBox="0 0 800 1643" role="img"><title>hbm-economics</title><rect width="800" height="1643" fill="#f5f3ed"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="52.0" font-size="26" fill="#a46e3d" font-weight="600">PEACE CAPITAL  /  產業研究</text><text x="44" y="118.0" font-size="42" fill="#203b35" font-weight="600">多一道測試，值不值得？</text><text x="44" y="183.1" font-size="29" fill="#56655e" font-weight="400">用增量成本與可避免損失比較；沒有跨廠商通用的最佳</text><text x="44" y="228.1" font-size="29" fill="#56655e" font-weight="400">測試次數。</text><text x="44" y="311.0" font-size="26" fill="#a46e3d" font-weight="600">潛在收益</text><rect x="44" y="341.0" width="712" height="226.15" rx="8" fill="#e2e9e0"/><text x="68" y="379.0" font-size="33" fill="#203b35" font-weight="600">額外攔截缺陷 × 可避免的後段成本</text><text x="68" y="450.1" font-size="30" fill="#56655e" font-weight="400">只計因提早攔截而省下的未來投入；已發生的晶粒</text><text x="68" y="496.6" font-size="30" fill="#56655e" font-weight="400">成本不會因測試倒退消失。</text><text x="44" y="599.1" font-size="26" fill="#a46e3d" font-weight="600">完整代價</text><rect x="44" y="629.15" width="712" height="226.15" rx="8" fill="#244e42"/><text x="68" y="667.1" font-size="33" fill="#fff" font-weight="600">測試成本 ＋ 產能與誤判代價</text><text x="68" y="738.3" font-size="30" fill="#fff" font-weight="400">包含設備占用、介面磨耗、維護、重測與誤判合格</text><text x="68" y="784.8" font-size="30" fill="#fff" font-weight="400">品等成本。</text><text x="44" y="887.3" font-size="26" fill="#a46e3d" font-weight="600">決策條件</text><rect x="44" y="917.3" width="712" height="226.15" rx="8" fill="#e2e9e0"/><text x="68" y="955.3" font-size="33" fill="#203b35" font-weight="600">收益足以補償成本與不確定性？</text><text x="68" y="1026.5" font-size="30" fill="#56655e" font-weight="400">以實際缺陷分布、覆蓋率與單位合格產出驗證；若</text><text x="68" y="1073.0" font-size="30" fill="#56655e" font-weight="400">資料不足，先做小範圍對照。</text><path d="M44 1175.45L756 1175.45" stroke="#b5c2b6" stroke-width="3" fill="none"/><text x="44" y="1219.5" font-size="26" fill="#56655e" font-weight="400">供應商的收入還取決於：設備配置、使用效率、單價、競爭與</text><text x="44" y="1259.8" font-size="26" fill="#56655e" font-weight="400">維護安排。</text><text x="44" y="1300.0" font-size="26" fill="#56655e" font-weight="400">買方需要更多測試，不能直接換算成某家公司的等比例獲利。</text><path d="M44 1374.3500000000001L756 1374.3500000000001" stroke="#b5c2b6" stroke-width="3" fill="none"/><text x="44" y="1418.4" font-size="26" fill="#56655e" font-weight="400">概念比較；未代入工廠數據，不是定價模型或量產效益估算。</text><text x="44" y="1492.7" font-size="26" fill="#244e42" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="1537.7" font-size="26" fill="#56655e" font-weight="400">資料：FormFactor 先進封裝應用資料 [4]；本文增量分析｜整</text><text x="44" y="1578.0" font-size="26" fill="#56655e" font-weight="400">理：2026.10.19</text></g></svg>