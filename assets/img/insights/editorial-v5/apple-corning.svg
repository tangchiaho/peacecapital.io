<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1070" viewBox="0 0 1440 1070" role="img"><title>apple-corning</title><rect width="1440" height="1070" fill="#f5f3ed"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="52.0" font-size="23" fill="#a46e3d" font-weight="600">PEACE CAPITAL  /  產業研究</text><text x="44" y="118.0" font-size="48" fill="#203b35" font-weight="600">資金承諾，和營運結果要分開讀</text><text x="44" y="192.4" font-size="28" fill="#56655e" font-weight="400">Apple × Corning｜2025 年 8 月 6 日公告的證據邊界</text><rect x="44" y="273.8" width="240" height="164" rx="8" fill="#e2e9e0"/><text x="68" y="335.8" font-size="30" fill="#244e42" font-weight="600">已宣布安排</text><text x="320" y="315.8" font-size="32" fill="#244e42" font-weight="600">25 億美元的新承諾</text><text x="320" y="368.8" font-size="28" fill="#56655e" font-weight="400">在肯塔基州 Harrodsburg 生產所有 iPhone 與 Apple Watch 蓋板玻璃。</text><rect x="44" y="465.8" width="240" height="164" rx="8" fill="#244e42"/><text x="68" y="527.8" font-size="30" fill="#fff" font-weight="600">能力建設方向</text><text x="320" y="507.8" font-size="32" fill="#244e42" font-weight="600">製造、工程與共同創新</text><text x="320" y="560.8" font-size="28" fill="#56655e" font-weight="400">公告規劃人力擴充及共同創新中心；反映採用需要材料以外的投入。</text><rect x="44" y="657.8" width="240" height="164" rx="8" fill="#e2e9e0"/><text x="68" y="719.8" font-size="30" fill="#244e42" font-weight="600">尚不能確認</text><text x="320" y="699.8" font-size="32" fill="#244e42" font-weight="600">實際投入與經濟回報</text><text x="320" y="752.8" font-size="28" fill="#56655e" font-weight="400">不能由承諾額推算已付款、已完成轉移、單一客戶毛利或投資回收。</text><path d="M44 849.8L1396 849.8" stroke="#b5c2b6" stroke-width="3" fill="none"/><text x="44" y="893.8" font-size="25" fill="#56655e" font-weight="400">承諾與計畫以公告當時狀態表述；本文未取得專案後續獨立損益。</text><text x="44" y="966.5" font-size="26" fill="#244e42" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="1011.5" font-size="22" fill="#56655e" font-weight="400">資料：Apple Newsroom，2025-08-06 [2]｜整理：2026.10.19</text></g></svg>