<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1839" viewBox="0 0 800 1839" role="img"><title>packaging-roles</title><rect width="800" height="1839" fill="#f5f3ed"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="52.0" font-size="26" fill="#a46e3d" font-weight="600">PEACE CAPITAL  /  產業研究</text><text x="44" y="118.0" font-size="42" fill="#203b35" font-weight="600">先進封裝：一項產品，多種責任</text><text x="44" y="183.1" font-size="29" fill="#56655e" font-weight="400">角色關係圖｜同一家公司可能跨越多個角色。</text><rect x="44.0" y="266.05" width="712.0" height="215.65" rx="8" fill="#e2e9e0"/><text x="68.0" y="304.1" font-size="26" fill="#a46e3d" font-weight="600">01</text><text x="68.0" y="343.1" font-size="33" fill="#203b35" font-weight="600">系統與晶片設計</text><text x="68.0" y="414.2" font-size="30" fill="#56655e" font-weight="400">定義功能、介面與功耗／散熱限制。</text><rect x="44.0" y="517.7" width="712.0" height="215.65" rx="8" fill="#e2e9e0"/><text x="68.0" y="555.7" font-size="26" fill="#a46e3d" font-weight="600">02</text><text x="68.0" y="594.7" font-size="33" fill="#203b35" font-weight="600">封裝與整合</text><text x="68.0" y="665.9" font-size="30" fill="#56655e" font-weight="400">協調互連、組裝與可量產條件。</text><rect x="44.0" y="769.35" width="712.0" height="215.65" rx="8" fill="#e2e9e0"/><text x="68.0" y="807.4" font-size="26" fill="#a46e3d" font-weight="600">03</text><text x="68.0" y="846.4" font-size="33" fill="#203b35" font-weight="600">設備與製程</text><text x="68.0" y="917.5" font-size="30" fill="#56655e" font-weight="400">在指定節拍與條件完成各工序。</text><rect x="44.0" y="1021.0" width="712.0" height="215.65" rx="8" fill="#e2e9e0"/><text x="68.0" y="1059.0" font-size="26" fill="#a46e3d" font-weight="600">04</text><text x="68.0" y="1098.0" font-size="33" fill="#203b35" font-weight="600">材料與結構</text><text x="68.0" y="1169.2" font-size="30" fill="#56655e" font-weight="400">滿足加工、熱、機械與可靠度要求。</text><rect x="44.0" y="1272.65" width="712.0" height="215.65" rx="8" fill="#e2e9e0"/><text x="68.0" y="1310.7" font-size="26" fill="#a46e3d" font-weight="600">05</text><text x="68.0" y="1349.7" font-size="33" fill="#203b35" font-weight="600">測試與品質回饋</text><text x="68.0" y="1420.8" font-size="30" fill="#56655e" font-weight="400">辨識缺陷、確認功能，回饋設計與製造。</text><path d="M44 1530.3000000000002L756 1530.3000000000002" stroke="#b5c2b6" stroke-width="3" fill="none"/><text x="44" y="1574.3" font-size="26" fill="#56655e" font-weight="400">研究角色分類，非固定製程或排他企業名單；平台名稱與單一</text><text x="44" y="1614.6" font-size="26" fill="#56655e" font-weight="400">步驟不能直接比較。</text><text x="44" y="1688.9" font-size="26" fill="#244e42" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="1733.9" font-size="26" fill="#56655e" font-weight="400">資料：TSMC、ASE、Amkor、Henkel、ASMPT、Advantes</text><text x="44" y="1774.2" font-size="26" fill="#56655e" font-weight="400">t、FormFactor [1–7]｜整理：2026.10.19</text></g></svg>