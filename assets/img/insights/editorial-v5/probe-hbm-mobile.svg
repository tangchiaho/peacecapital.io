<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1753" viewBox="0 0 800 1753" role="img"><title>probe-hbm</title><rect width="800" height="1753" fill="#f5f3ed"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="52.0" font-size="26" fill="#a46e3d" font-weight="600">PEACE CAPITAL  /  產業研究</text><text x="44" y="118.0" font-size="42" fill="#203b35" font-weight="600">測試對象改變，能回答的問題也改變</text><text x="44" y="183.1" font-size="29" fill="#56655e" font-weight="400">HBM｜晶粒合格，不等於堆疊連接已經確認。</text><rect x="44.0" y="266.05" width="712.0" height="262.15" rx="8" fill="#e2e9e0"/><text x="68.0" y="304.1" font-size="26" fill="#a46e3d" font-weight="600">01</text><text x="68.0" y="343.1" font-size="33" fill="#203b35" font-weight="600">堆疊前：晶粒</text><text x="68.0" y="414.2" font-size="30" fill="#56655e" font-weight="400">確認該階段的晶粒電性與功能；不能提前篩出尚未</text><text x="68.0" y="460.7" font-size="30" fill="#56655e" font-weight="400">形成的組裝缺陷。</text><rect x="44.0" y="564.2" width="712.0" height="262.15" rx="8" fill="#e2e9e0"/><text x="68.0" y="602.2" font-size="26" fill="#a46e3d" font-weight="600">02</text><text x="68.0" y="641.2" font-size="33" fill="#203b35" font-weight="600">堆疊後：組合體</text><text x="68.0" y="712.4" font-size="30" fill="#56655e" font-weight="400">確認連接與整體表現；測試介面、溫度及覆蓋範圍</text><text x="68.0" y="758.9" font-size="30" fill="#56655e" font-weight="400">仍需說明。</text><text x="44" y="868.4" font-size="26" fill="#a46e3d" font-weight="600">KGD</text><rect x="44" y="898.35" width="712" height="226.15" rx="8" fill="#e2e9e0"/><text x="68" y="936.4" font-size="33" fill="#203b35" font-weight="600">Known Good Die</text><text x="68" y="1007.5" font-size="30" fill="#56655e" font-weight="400">對象是晶粒；「合格」取決於當時執行的測試條</text><text x="68" y="1054.0" font-size="30" fill="#56655e" font-weight="400">件。</text><text x="44" y="1156.5" font-size="26" fill="#a46e3d" font-weight="600">KGS</text><rect x="44" y="1186.5" width="712" height="226.15" rx="8" fill="#244e42"/><text x="68" y="1224.5" font-size="33" fill="#fff" font-weight="600">Known Good Stack</text><text x="68" y="1295.7" font-size="30" fill="#fff" font-weight="400">對象是堆疊；不代表客戶最終驗收與所有可靠度工</text><text x="68" y="1342.2" font-size="30" fill="#fff" font-weight="400">作均已完成。</text><path d="M44 1444.65L756 1444.65" stroke="#b5c2b6" stroke-width="3" fill="none"/><text x="44" y="1488.7" font-size="26" fill="#56655e" font-weight="400">可選的測試位置與次數因產品而異；不是所有 HBM 世代的統</text><text x="44" y="1529.0" font-size="26" fill="#56655e" font-weight="400">一流程。</text><text x="44" y="1603.2" font-size="26" fill="#244e42" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="1648.2" font-size="26" fill="#56655e" font-weight="400">資料：FormFactor 技術簡報／KGD 文章 [8、9]｜整理：2026.</text><text x="44" y="1688.5" font-size="26" fill="#56655e" font-weight="400">10.19</text></g></svg>