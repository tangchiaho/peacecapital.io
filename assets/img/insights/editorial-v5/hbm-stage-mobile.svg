<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1931" viewBox="0 0 800 1931" role="img"><title>hbm-stage</title><rect width="800" height="1931" fill="#f5f3ed"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="52.0" font-size="26" fill="#a46e3d" font-weight="600">PEACE CAPITAL  /  產業研究</text><text x="44" y="118.0" font-size="42" fill="#203b35" font-weight="600">測試對象改變，能回答的問題也改變</text><text x="44" y="183.1" font-size="29" fill="#56655e" font-weight="400">HBM｜晶粒合格，不等於堆疊連接已經確認。</text><text x="44" y="266.1" font-size="32" fill="#244e42" font-weight="600">堆疊前：單顆晶粒</text><rect x="84" y="344.05" width="632" height="24" rx="2" fill="#244e42"/><rect x="112.0" y="348.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="184.0" y="348.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="256.0" y="348.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="328.0" y="348.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="400.0" y="348.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="472.0" y="348.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="544.0" y="348.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="616.0" y="348.05" width="8" height="16" rx="0" fill="#d9c498"/><text x="44" y="526.0" font-size="30" fill="#244e42" font-weight="600">晶粒電性與功能篩選</text><text x="44" y="575.0" font-size="28" fill="#56655e" font-weight="400">尚未形成的組裝缺陷，無法提前測到。</text><text x="44" y="656.0" font-size="32" fill="#244e42" font-weight="600">堆疊後：組合體</text><rect x="84" y="734.05" width="632" height="24" rx="2" fill="#244e42"/><rect x="112.0" y="738.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="184.0" y="738.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="256.0" y="738.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="328.0" y="738.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="400.0" y="738.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="472.0" y="738.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="544.0" y="738.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="616.0" y="738.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="84" y="762.05" width="632" height="24" rx="2" fill="#a46e3d"/><rect x="112.0" y="766.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="184.0" y="766.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="256.0" y="766.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="328.0" y="766.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="400.0" y="766.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="472.0" y="766.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="544.0" y="766.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="616.0" y="766.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="84" y="790.05" width="632" height="24" rx="2" fill="#244e42"/><rect x="112.0" y="794.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="184.0" y="794.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="256.0" y="794.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="328.0" y="794.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="400.0" y="794.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="472.0" y="794.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="544.0" y="794.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="616.0" y="794.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="84" y="818.05" width="632" height="24" rx="2" fill="#a46e3d"/><rect x="112.0" y="822.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="184.0" y="822.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="256.0" y="822.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="328.0" y="822.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="400.0" y="822.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="472.0" y="822.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="544.0" y="822.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="616.0" y="822.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="84" y="846.05" width="632" height="24" rx="2" fill="#244e42"/><rect x="112.0" y="850.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="184.0" y="850.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="256.0" y="850.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="328.0" y="850.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="400.0" y="850.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="472.0" y="850.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="544.0" y="850.05" width="8" height="16" rx="0" fill="#d9c498"/><rect x="616.0" y="850.05" width="8" height="16" rx="0" fill="#d9c498"/><text x="44" y="916.0" font-size="30" fill="#244e42" font-weight="600">連接與整體功能確認</text><text x="44" y="965.0" font-size="28" fill="#56655e" font-weight="400">測試範圍仍受介面、條件與方案限制。</text><text x="44" y="1046.0" font-size="26" fill="#a46e3d" font-weight="600">KGD</text><rect x="44" y="1076.05" width="712" height="226.15" rx="8" fill="#e2e9e0"/><text x="68" y="1114.0" font-size="33" fill="#203b35" font-weight="600">Known Good Die</text><text x="68" y="1185.2" font-size="30" fill="#56655e" font-weight="400">對象是晶粒；「合格」取決於當時執行的測試條</text><text x="68" y="1231.7" font-size="30" fill="#56655e" font-weight="400">件。</text><text x="44" y="1334.2" font-size="26" fill="#a46e3d" font-weight="600">KGS</text><rect x="44" y="1364.2" width="712" height="226.15" rx="8" fill="#244e42"/><text x="68" y="1402.2" font-size="33" fill="#fff" font-weight="600">Known Good Stack</text><text x="68" y="1473.4" font-size="30" fill="#fff" font-weight="400">對象是堆疊；不代表客戶最終驗收與所有可靠度工</text><text x="68" y="1519.9" font-size="30" fill="#fff" font-weight="400">作均已完成。</text><path d="M44 1622.3500000000001L756 1622.3500000000001" stroke="#b5c2b6" stroke-width="3" fill="none"/><text x="44" y="1666.4" font-size="26" fill="#56655e" font-weight="400">可選的測試位置與次數因產品而異；不是所有 HBM 世代的統</text><text x="44" y="1706.7" font-size="26" fill="#56655e" font-weight="400">一流程。</text><text x="44" y="1781.0" font-size="26" fill="#244e42" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="1826.0" font-size="26" fill="#56655e" font-weight="400">資料：FormFactor 技術簡報／KGD 文章 [2、3]；Micron HB</text><text x="44" y="1866.2" font-size="26" fill="#56655e" font-weight="400">M4 [1]｜整理：2026.10.19</text></g></svg>