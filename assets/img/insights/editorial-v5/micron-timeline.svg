<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1237" viewBox="0 0 1440 1237" role="img"><title>micron-timeline</title><rect width="1440" height="1237" fill="#f5f3ed"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="52.0" font-size="23" fill="#a46e3d" font-weight="600">PEACE CAPITAL  /  產業研究</text><text x="44" y="118.0" font-size="48" fill="#203b35" font-weight="600">同樣叫 HBM4，版本與狀態仍不同</text><text x="44" y="192.4" font-size="28" fill="#56655e" font-weight="400">Micron 公開事件｜36GB 12 層與 48GB 16 層分開看</text><path d="M66 263.8L66 433.8" stroke="#b5c2b6" stroke-width="3" fill="none"/><circle cx="66" cy="286.8" r="11" fill="#a46e3d"/><text x="98" y="294.8" font-size="26" fill="#a46e3d" font-weight="600">2025.06.10｜36GB 12 層</text><text x="98" y="343.8" font-size="32" fill="#244e42" font-weight="600">向多家關鍵客戶送樣</text><text x="98" y="393.4" font-size="26" fill="#56655e" font-weight="400">公告規劃 2026 年量產；此時量產屬預期。</text><path d="M66 459.70000000000005L66 629.7" stroke="#b5c2b6" stroke-width="3" fill="none"/><circle cx="66" cy="482.70000000000005" r="11" fill="#a46e3d"/><text x="98" y="490.7" font-size="26" fill="#a46e3d" font-weight="600">2026 第一季｜36GB 12 層</text><text x="98" y="539.7" font-size="32" fill="#244e42" font-weight="600">量產出貨開始</text><text x="98" y="589.3" font-size="26" fill="#56655e" font-weight="400">2026.03.16 公告確認已開始量產出貨；產品設計對應 NVIDIA Vera Rubin。</text><path d="M66 655.6L66 825.6" stroke="#b5c2b6" stroke-width="3" fill="none"/><circle cx="66" cy="678.6" r="11" fill="#a46e3d"/><text x="98" y="686.6" font-size="26" fill="#a46e3d" font-weight="600">2026.03.16｜48GB 16 層</text><text x="98" y="735.6" font-size="32" fill="#244e42" font-weight="600">另一版本仍在送樣</text><text x="98" y="785.2" font-size="26" fill="#56655e" font-weight="400">同一份公告不能解讀為所有 HBM4 容量與堆疊版本都已量產。</text><path d="M44 861.5L1396 861.5" stroke="#b5c2b6" stroke-width="3" fill="none"/><text x="44" y="905.5" font-size="25" fill="#56655e" font-weight="400">仍未公開：每個客戶的驗收節點、個別成交價、專案毛利與回款。</text><text x="44" y="944.2" font-size="25" fill="#56655e" font-weight="400">不能拼接不同產品或不同客戶的公告，宣稱單一專案已完成所有關卡。</text><path d="M44 1017.0L1396 1017.0" stroke="#b5c2b6" stroke-width="3" fill="none"/><text x="44" y="1061.0" font-size="25" fill="#56655e" font-weight="400">事件以所列公告為證；不宣稱已覆蓋查核日前所有後續產品進展。</text><text x="44" y="1133.8" font-size="26" fill="#244e42" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="1178.8" font-size="22" fill="#56655e" font-weight="400">資料：Micron 官方公告 2025-06-10 [6]、2026-03-16 [7]｜整理：2026.10.19</text></g></svg>