<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1646" viewBox="0 0 800 1646" role="img"><title>packaging-economics</title><rect width="800" height="1646" fill="#f5f3ed"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="52.0" font-size="26" fill="#a46e3d" font-weight="600">PEACE CAPITAL  /  產業研究</text><text x="44" y="118.0" font-size="42" fill="#203b35" font-weight="600">產業機會，要沿不同收入路徑追蹤</text><text x="44" y="183.1" font-size="29" fill="#56655e" font-weight="400">設備、材料與整合服務，交付內容和資金風險不同。</text><rect x="44.0" y="266.05" width="712.0" height="319.15" rx="8" fill="#e2e9e0"/><text x="68.0" y="304.1" font-size="33" fill="#203b35" font-weight="600">設備</text><text x="68.0" y="375.2" font-size="30" fill="#56655e" font-weight="400">應核對的交付證據：訂單、出貨與依契約驗收；檢</text><text x="68.0" y="421.7" font-size="30" fill="#56655e" font-weight="400">查客戶實際使用</text><text x="68.0" y="468.2" font-size="30" fill="#56655e" font-weight="400">資金與風險：研發、存貨、安裝與回款；擴產訂單</text><text x="68.0" y="514.7" font-size="30" fill="#56655e" font-weight="400">可能遞延</text><rect x="44.0" y="621.2" width="712.0" height="319.15" rx="8" fill="#e2e9e0"/><text x="68.0" y="659.2" font-size="33" fill="#203b35" font-weight="600">材料</text><text x="68.0" y="730.4" font-size="30" fill="#56655e" font-weight="400">應核對的交付證據：指定製程接受、批次穩定與重</text><text x="68.0" y="776.9" font-size="30" fill="#56655e" font-weight="400">複出貨</text><text x="68.0" y="823.4" font-size="30" fill="#56655e" font-weight="400">資金與風險：專用產能、批次報廢與集中度；用量</text><text x="68.0" y="869.9" font-size="30" fill="#56655e" font-weight="400">不等於利潤</text><rect x="44.0" y="976.35" width="712.0" height="319.15" rx="8" fill="#e2e9e0"/><text x="68.0" y="1014.4" font-size="33" fill="#203b35" font-weight="600">整合服務</text><text x="68.0" y="1085.5" font-size="30" fill="#56655e" font-weight="400">應核對的交付證據：可用產出、良率與交付；需求</text><text x="68.0" y="1132.0" font-size="30" fill="#56655e" font-weight="400">與產能配合</text><text x="68.0" y="1178.5" font-size="30" fill="#56655e" font-weight="400">資金與風險：設備與人力先投入；稼動、重工與折</text><text x="68.0" y="1225.0" font-size="30" fill="#56655e" font-weight="400">舊影響回收</text><path d="M44 1337.5L756 1337.5" stroke="#b5c2b6" stroke-width="3" fill="none"/><text x="44" y="1381.5" font-size="26" fill="#56655e" font-weight="400">交付檢查表不是統一收入認列規則；公司會計政策與契約條件</text><text x="44" y="1421.8" font-size="26" fill="#56655e" font-weight="400">須另外核對。</text><text x="44" y="1496.1" font-size="26" fill="#244e42" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="1541.1" font-size="26" fill="#56655e" font-weight="400">資料：各角色官方產品資料 [1–7]；本文經營與投資分析｜整</text><text x="44" y="1581.4" font-size="26" fill="#56655e" font-weight="400">理：2026.10.19</text></g></svg>