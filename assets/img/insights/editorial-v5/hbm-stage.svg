<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1298" viewBox="0 0 1440 1298" role="img"><title>hbm-stage</title><rect width="1440" height="1298" fill="#f5f3ed"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="52.0" font-size="23" fill="#a46e3d" font-weight="600">PEACE CAPITAL  /  產業研究</text><text x="44" y="118.0" font-size="48" fill="#203b35" font-weight="600">測試對象改變，能回答的問題也改變</text><text x="44" y="192.4" font-size="28" fill="#56655e" font-weight="400">HBM｜晶粒合格，不等於堆疊連接已經確認。</text><text x="44" y="273.8" font-size="32" fill="#244e42" font-weight="600">堆疊前：單顆晶粒</text><rect x="84" y="351.8" width="566" height="24" rx="2" fill="#244e42"/><rect x="112.0" y="355.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="175.75" y="355.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="239.5" y="355.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="303.25" y="355.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="367.0" y="355.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="430.75" y="355.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="494.5" y="355.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="558.25" y="355.8" width="8" height="16" rx="0" fill="#d9c498"/><text x="44" y="533.8" font-size="30" fill="#244e42" font-weight="600">晶粒電性與功能篩選</text><text x="44" y="582.8" font-size="28" fill="#56655e" font-weight="400">尚未形成的組裝缺陷，無法提前測到。</text><text x="750" y="273.8" font-size="32" fill="#244e42" font-weight="600">堆疊後：組合體</text><rect x="790" y="351.8" width="566" height="24" rx="2" fill="#244e42"/><rect x="818.0" y="355.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="881.75" y="355.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="945.5" y="355.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="1009.25" y="355.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="1073.0" y="355.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="1136.75" y="355.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="1200.5" y="355.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="1264.25" y="355.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="790" y="379.8" width="566" height="24" rx="2" fill="#a46e3d"/><rect x="818.0" y="383.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="881.75" y="383.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="945.5" y="383.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="1009.25" y="383.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="1073.0" y="383.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="1136.75" y="383.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="1200.5" y="383.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="1264.25" y="383.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="790" y="407.8" width="566" height="24" rx="2" fill="#244e42"/><rect x="818.0" y="411.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="881.75" y="411.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="945.5" y="411.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="1009.25" y="411.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="1073.0" y="411.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="1136.75" y="411.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="1200.5" y="411.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="1264.25" y="411.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="790" y="435.8" width="566" height="24" rx="2" fill="#a46e3d"/><rect x="818.0" y="439.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="881.75" y="439.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="945.5" y="439.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="1009.25" y="439.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="1073.0" y="439.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="1136.75" y="439.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="1200.5" y="439.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="1264.25" y="439.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="790" y="463.8" width="566" height="24" rx="2" fill="#244e42"/><rect x="818.0" y="467.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="881.75" y="467.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="945.5" y="467.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="1009.25" y="467.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="1073.0" y="467.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="1136.75" y="467.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="1200.5" y="467.8" width="8" height="16" rx="0" fill="#d9c498"/><rect x="1264.25" y="467.8" width="8" height="16" rx="0" fill="#d9c498"/><text x="750" y="533.8" font-size="30" fill="#244e42" font-weight="600">連接與整體功能確認</text><text x="750" y="582.8" font-size="28" fill="#56655e" font-weight="400">測試範圍仍受介面、條件與方案限制。</text><rect x="44" y="693.8" width="240" height="164" rx="8" fill="#e2e9e0"/><text x="68" y="755.8" font-size="30" fill="#244e42" font-weight="600">KGD</text><text x="320" y="735.8" font-size="32" fill="#244e42" font-weight="600">Known Good Die</text><text x="320" y="788.8" font-size="28" fill="#56655e" font-weight="400">對象是晶粒；「合格」取決於當時執行的測試條件。</text><rect x="44" y="885.8" width="240" height="164" rx="8" fill="#244e42"/><text x="68" y="947.8" font-size="30" fill="#fff" font-weight="600">KGS</text><text x="320" y="927.8" font-size="32" fill="#244e42" font-weight="600">Known Good Stack</text><text x="320" y="980.8" font-size="28" fill="#56655e" font-weight="400">對象是堆疊；不代表客戶最終驗收與所有可靠度工作均已完成。</text><path d="M44 1077.8L1396 1077.8" stroke="#b5c2b6" stroke-width="3" fill="none"/><text x="44" y="1121.8" font-size="25" fill="#56655e" font-weight="400">可選的測試位置與次數因產品而異；不是所有 HBM 世代的統一流程。</text><text x="44" y="1194.5" font-size="26" fill="#244e42" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="1239.5" font-size="22" fill="#56655e" font-weight="400">資料：FormFactor 技術簡報／KGD 文章 [2、3]；Micron HBM4 [1]｜整理：2026.10.19</text></g></svg>