<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="943" viewBox="0 0 1440 943" role="img"><title>probe-roles</title><rect width="1440" height="943" fill="#f5f3ed"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="52.0" font-size="23" fill="#a46e3d" font-weight="600">PEACE CAPITAL  /  產業研究</text><text x="44" y="118.0" font-size="48" fill="#203b35" font-weight="600">一場晶圓測試，三種不同工作</text><text x="44" y="192.4" font-size="28" fill="#56655e" font-weight="400">訊號判斷、接觸介面與位置控制要協同。</text><rect x="44.0" y="273.8" width="432.0" height="251.3" rx="8" fill="#e2e9e0"/><text x="68.0" y="311.8" font-size="23" fill="#a46e3d" font-weight="600">01</text><text x="68.0" y="350.8" font-size="32" fill="#203b35" font-weight="600">ATE 測試機</text><text x="68.0" y="420.4" font-size="27" fill="#56655e" font-weight="400">提供測試訊號、量測回應，依條</text><text x="68.0" y="462.2" font-size="27" fill="#56655e" font-weight="400">件判定結果。</text><rect x="504.0" y="273.8" width="432.0" height="251.3" rx="8" fill="#244e42"/><text x="528.0" y="311.8" font-size="23" fill="#e6c296" font-weight="600">02</text><text x="528.0" y="350.8" font-size="32" fill="#fff" font-weight="600">探針卡</text><text x="528.0" y="420.4" font-size="27" fill="#fff" font-weight="400">把測試機與晶圓接點連接；電性</text><text x="528.0" y="462.2" font-size="27" fill="#fff" font-weight="400">與機械條件共同影響接觸。</text><rect x="964.0" y="273.8" width="432.0" height="251.3" rx="8" fill="#e2e9e0"/><text x="988.0" y="311.8" font-size="23" fill="#a46e3d" font-weight="600">03</text><text x="988.0" y="350.8" font-size="32" fill="#203b35" font-weight="600">Prober 探針台</text><text x="988.0" y="420.4" font-size="27" fill="#56655e" font-weight="400">控制晶圓位置、對準與接觸動</text><text x="988.0" y="462.2" font-size="27" fill="#56655e" font-weight="400">作；配合測試方案運作。</text><path d="M44 567.1L1396 567.1" stroke="#b5c2b6" stroke-width="3" fill="none"/><text x="44" y="611.1" font-size="25" fill="#56655e" font-weight="400">電性路徑：測試機 ⇄ 探針卡 ⇄ 晶圓接點</text><text x="44" y="649.9" font-size="25" fill="#56655e" font-weight="400">機械配合：探針台定位與接觸控制</text><path d="M44 722.6L1396 722.6" stroke="#b5c2b6" stroke-width="3" fill="none"/><text x="44" y="766.6" font-size="25" fill="#56655e" font-weight="400">功能概念示意，非設備接線圖；實際系統組成依產品與測試配置而異。</text><text x="44" y="839.4" font-size="26" fill="#244e42" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="884.4" font-size="22" fill="#56655e" font-weight="400">資料：JEM、Technoprobe、CHPT 產品說明 [1–3]｜整理：2026.10.19</text></g></svg>