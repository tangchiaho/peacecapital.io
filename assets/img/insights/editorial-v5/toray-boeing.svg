<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1082" viewBox="0 0 1440 1082" role="img"><title>toray-boeing</title><rect width="1440" height="1082" fill="#f5f3ed"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="52.0" font-size="23" fill="#a46e3d" font-weight="600">PEACE CAPITAL  /  產業研究</text><text x="44" y="118.0" font-size="48" fill="#203b35" font-weight="600">長期供應，需要先安排能力與責任</text><text x="44" y="192.4" font-size="28" fill="#56655e" font-weight="400">Toray × Boeing｜合作、認證與產能投入的時間差</text><path d="M66 263.8L66 433.8" stroke="#b5c2b6" stroke-width="3" fill="none"/><circle cx="66" cy="286.8" r="11" fill="#a46e3d"/><text x="98" y="294.8" font-size="26" fill="#a46e3d" font-weight="600">2014｜合作備忘錄</text><text x="98" y="343.8" font-size="32" fill="#244e42" font-weight="600">將 777X 機翼材料納入合作方向</text><text x="98" y="393.4" font-size="26" fill="#56655e" font-weight="400">公開合作安排，與實際完成供應或投資回收不同。</text><path d="M66 459.70000000000005L66 629.7" stroke="#b5c2b6" stroke-width="3" fill="none"/><circle cx="66" cy="482.70000000000005" r="11" fill="#a46e3d"/><text x="98" y="490.7" font-size="26" fill="#a46e3d" font-weight="600">2015｜延長供應協議</text><text x="98" y="539.7" font-size="32" fill="#244e42" font-weight="600">長約結合既有 787 與新增 777X 範圍</text><text x="98" y="589.3" font-size="26" fill="#56655e" font-weight="400">公告同時規劃南卡羅來納州一貫生產基地；先投入，再逐步形成供應能力。</text><path d="M66 655.6L66 825.6" stroke="#b5c2b6" stroke-width="3" fill="none"/><circle cx="66" cy="678.6" r="11" fill="#a46e3d"/><text x="98" y="686.6" font-size="26" fill="#a46e3d" font-weight="600">後續要追蹤｜營運結果</text><text x="98" y="735.6" font-size="32" fill="#244e42" font-weight="600">認證、量產與回收要各自驗證</text><text x="98" y="785.2" font-size="26" fill="#56655e" font-weight="400">2015 年公告中的認證與投產日期是當時計畫；不能直接當作已實現成果。</text><path d="M44 861.5L1396 861.5" stroke="#b5c2b6" stroke-width="3" fill="none"/><text x="44" y="905.5" font-size="25" fill="#56655e" font-weight="400">圖示整理歷史公告與研究問題；未將舊時程推估改寫為實際完成日期。</text><text x="44" y="978.2" font-size="26" fill="#244e42" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="1023.2" font-size="22" fill="#56655e" font-weight="400">資料：Boeing 2014 公告 [4]；Toray 2015 供應協議 [3]｜整理：2026.10.19</text></g></svg>