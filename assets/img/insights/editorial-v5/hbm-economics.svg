<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1226" viewBox="0 0 1440 1226" role="img"><title>hbm-economics</title><rect width="1440" height="1226" fill="#f5f3ed"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="44" y="52.0" font-size="23" fill="#a46e3d" font-weight="600">PEACE CAPITAL  /  產業研究</text><text x="44" y="118.0" font-size="48" fill="#203b35" font-weight="600">多一道測試，值不值得？</text><text x="44" y="192.4" font-size="28" fill="#56655e" font-weight="400">用增量成本與可避免損失比較；沒有跨廠商通用的最佳測試次數。</text><rect x="44" y="273.8" width="240" height="164" rx="8" fill="#e2e9e0"/><text x="68" y="335.8" font-size="30" fill="#244e42" font-weight="600">潛在收益</text><text x="320" y="315.8" font-size="32" fill="#244e42" font-weight="600">額外攔截缺陷 × 可避免的後段成本</text><text x="320" y="368.8" font-size="28" fill="#56655e" font-weight="400">只計因提早攔截而省下的未來投入；已發生的晶粒成本不會因測試倒退消失。</text><rect x="44" y="465.8" width="240" height="164" rx="8" fill="#244e42"/><text x="68" y="527.8" font-size="30" fill="#fff" font-weight="600">完整代價</text><text x="320" y="507.8" font-size="32" fill="#244e42" font-weight="600">測試成本 ＋ 產能與誤判代價</text><text x="320" y="560.8" font-size="28" fill="#56655e" font-weight="400">包含設備占用、介面磨耗、維護、重測與誤判合格品等成本。</text><rect x="44" y="657.8" width="240" height="164" rx="8" fill="#e2e9e0"/><text x="68" y="719.8" font-size="30" fill="#244e42" font-weight="600">決策條件</text><text x="320" y="699.8" font-size="32" fill="#244e42" font-weight="600">收益足以補償成本與不確定性？</text><text x="320" y="752.8" font-size="28" fill="#56655e" font-weight="400">以實際缺陷分布、覆蓋率與單位合格產出驗證；若資料不足，先做小範圍對照。</text><path d="M44 849.8L1396 849.8" stroke="#b5c2b6" stroke-width="3" fill="none"/><text x="44" y="893.8" font-size="25" fill="#56655e" font-weight="400">供應商的收入還取決於：設備配置、使用效率、單價、競爭與維護安排。</text><text x="44" y="932.5" font-size="25" fill="#56655e" font-weight="400">買方需要更多測試，不能直接換算成某家公司的等比例獲利。</text><path d="M44 1005.3L1396 1005.3" stroke="#b5c2b6" stroke-width="3" fill="none"/><text x="44" y="1049.3" font-size="25" fill="#56655e" font-weight="400">概念比較；未代入工廠數據，不是定價模型或量產效益估算。</text><text x="44" y="1122.0" font-size="26" fill="#244e42" font-weight="600">研究整理・製圖｜和平資本研究部</text><text x="44" y="1167.0" font-size="22" fill="#56655e" font-weight="400">資料：FormFactor 先進封裝應用資料 [4]；本文增量分析｜整理：2026.10.19</text></g></svg>