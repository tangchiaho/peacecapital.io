<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1460" viewBox="0 0 800 1460" role="img"><title>從測試到可持續生意的三層證據</title><desc>技術可行、客戶可用與生意可持續是三種不同的研究證據，可平行補強。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7f3e9"/><stop offset="1" stop-color="#e7eee6"/></linearGradient><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#294b3f" opacity=".09"/></pattern></defs><rect width="100%" height="100%" fill="url(#bg)"/><rect width="100%" height="100%" fill="url(#dots)"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="50" y="66" font-size="24" fill="#8a603b" font-weight="600">材料商業化｜三種不同的證據</text><text x="50" y="133" font-size="48" fill="#203c35" font-weight="400">測試通過之後，</text><text x="50" y="199" font-size="48" fill="#203c35" font-weight="400">還要回答什麼？</text><rect x="50" y="250" width="700" height="300" rx="18" fill="#234d40"/><text x="78" y="310" font-size="42" fill="#d8c69b" font-weight="600">01</text><text x="165" y="309" font-size="40" fill="#fff" font-weight="600">技術可行</text><text x="78" y="372" font-size="30" fill="#e7eee6" font-weight="400">試片與測試報告</text><path d="M78 401h644" stroke="#fff" opacity=".25"/><text x="78" y="458" font-size="34" fill="#fff" font-weight="400">牌號、方法與條件</text><text x="78" y="508" font-size="34" fill="#fff" font-weight="400">界定性能證據的範圍</text><rect x="50" y="585" width="700" height="300" rx="18" fill="#386d65"/><text x="78" y="645" font-size="42" fill="#d8c69b" font-weight="600">02</text><text x="165" y="644" font-size="40" fill="#fff" font-weight="600">客戶可用</text><text x="78" y="707" font-size="30" fill="#e7eee6" font-weight="400">零件、製程與接受條件</text><path d="M78 736h644" stroke="#fff" opacity=".25"/><text x="78" y="793" font-size="34" fill="#fff" font-weight="400">加工窗口與跨批次結果</text><text x="78" y="843" font-size="34" fill="#fff" font-weight="400">確認能否放進實際產線</text><rect x="50" y="920" width="700" height="300" rx="18" fill="#985e38"/><text x="78" y="980" font-size="42" fill="#d8c69b" font-weight="600">03</text><text x="165" y="979" font-size="40" fill="#fff" font-weight="600">生意可持續</text><text x="78" y="1042" font-size="30" fill="#e7eee6" font-weight="400">交付、重複採購與回款</text><path d="M78 1071h644" stroke="#fff" opacity=".25"/><text x="78" y="1128" font-size="34" fill="#fff" font-weight="400">採用成本、服務與資本</text><text x="78" y="1178" font-size="34" fill="#fff" font-weight="400">判斷供應關係能否延續</text><text x="50" y="1320" font-size="28" fill="#465b51" font-weight="400">研究用途：這三層證據可以平行補強，</text><text x="50" y="1362" font-size="28" fill="#465b51" font-weight="400">不代表所有產業共用的固定認證順序。</text><text x="50" y="1425" font-size="21" fill="#647268" font-weight="400">本文研究整理｜原始案例：UL、BASF、Toray／NCAMP</text></g></svg>
