<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1550" viewBox="0 0 800 1550" role="img"><title>訂單、投入與回款的資金框架</title><desc>材料公司的開發、備料與設備投入，需連同驗收和付款條件評估；圖示不是實際財務數據。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7f3e9"/><stop offset="1" stop-color="#e7eee6"/></linearGradient><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#294b3f" opacity=".09"/></pattern></defs><rect width="100%" height="100%" fill="url(#bg)"/><rect width="100%" height="100%" fill="url(#dots)"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="50" y="65" font-size="24" fill="#8a603b" font-weight="600">看公司｜把訂單和資金放在同一張圖</text><text x="50" y="138" font-size="48" fill="#203c35" font-weight="400">訂單增加，</text><text x="50" y="206" font-size="48" fill="#203c35" font-weight="400">現金未必先增加</text><path d="M84 310V1100" stroke="#b68b61" stroke-width="6"/><circle cx="84" cy="302" r="23" fill="#2a5748"/><text x="75" y="312" font-size="25" fill="#fff" font-weight="400">1</text><text x="137" y="316" font-size="43" fill="#203c35" font-weight="600">先投入</text><text x="137" y="385" font-size="33" fill="#203c35" font-weight="400">開發、驗證、專用設備</text><text x="137" y="452" font-size="31" fill="#98613b" font-weight="400">投入能否轉用？</text><circle cx="84" cy="592" r="23" fill="#2a5748"/><text x="75" y="602" font-size="25" fill="#fff" font-weight="400">2</text><text x="137" y="606" font-size="43" fill="#203c35" font-weight="600">履約中</text><text x="137" y="675" font-size="33" fill="#203c35" font-weight="400">備料、製造、庫存與交付</text><text x="137" y="742" font-size="31" fill="#98613b" font-weight="400">需求延後由誰承擔？</text><circle cx="84" cy="882" r="23" fill="#2a5748"/><text x="75" y="892" font-size="25" fill="#fff" font-weight="400">3</text><text x="137" y="896" font-size="43" fill="#203c35" font-weight="600">後回收</text><text x="137" y="965" font-size="33" fill="#203c35" font-weight="400">驗收、請款與客戶付款</text><text x="137" y="1032" font-size="31" fill="#98613b" font-weight="400">條件與時點是否清楚？</text><rect x="50" y="1170" width="700" height="240" rx="16" fill="#213f35"/><text x="80" y="1232" font-size="34" fill="#e9d1a3" font-weight="600">投資判斷要多問一步</text><text x="80" y="1293" font-size="31" fill="#fff" font-weight="400">收入如何形成？資金先壓在哪裡？</text><text x="80" y="1346" font-size="31" fill="#fff" font-weight="400">若客戶延後，還能撐住多久？</text><text x="50" y="1478" font-size="23" fill="#52645a" font-weight="400">示意框架，非實際現金流、會計認列或固定收付款順序。</text><text x="50" y="1512" font-size="23" fill="#52645a" font-weight="400">各項支出與收款可能交錯，須依個別合約核對。</text></g></svg>
