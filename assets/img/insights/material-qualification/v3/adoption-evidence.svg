<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img"><title>從測試到可持續生意的三層證據</title><desc>技術可行、客戶可用與生意可持續是三種不同的研究證據，可平行補強。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7f3e9"/><stop offset="1" stop-color="#e7eee6"/></linearGradient><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#294b3f" opacity=".09"/></pattern></defs><rect width="100%" height="100%" fill="url(#bg)"/><rect width="100%" height="100%" fill="url(#dots)"/><g font-family="Noto Sans CJK TC,Arial,sans-serif"><text x="50" y="66" font-size="24" fill="#8a603b" font-weight="600">材料商業化｜三種不同的證據</text><text x="50" y="145" font-size="54" fill="#203c35" font-weight="600">測試通過之後，還要回答什麼？</text><rect x="50" y="228" width="420" height="510" rx="18" fill="#234d40"/><text x="78" y="288" font-size="42" fill="#d8c69b" font-weight="600">01</text><text x="165" y="287" font-size="40" fill="#fff" font-weight="600">技術可行</text><circle cx="260" cy="410" r="62" fill="#fff" opacity=".1"/><path d="M235 377v45l-23 28h96l-23-28v-45M229 428h62" fill="none" stroke="#ead8b2" stroke-width="6"/><text x="78" y="533" font-size="29" fill="#e7eee6" font-weight="400">試片與測試報告</text><text x="78" y="608" font-size="29" fill="#fff" font-weight="400">牌號、方法與條件</text><text x="78" y="660" font-size="29" fill="#fff" font-weight="400">界定性能證據的範圍</text><rect x="510" y="228" width="420" height="510" rx="18" fill="#386d65"/><text x="538" y="288" font-size="42" fill="#d8c69b" font-weight="600">02</text><text x="625" y="287" font-size="40" fill="#fff" font-weight="600">客戶可用</text><circle cx="720" cy="410" r="62" fill="#fff" opacity=".1"/><path d="M675 412l28 28 59-60" fill="none" stroke="#ead8b2" stroke-width="9"/><text x="538" y="533" font-size="29" fill="#e7eee6" font-weight="400">零件、製程與接受條件</text><text x="538" y="608" font-size="29" fill="#fff" font-weight="400">加工窗口與跨批次結果</text><text x="538" y="660" font-size="29" fill="#fff" font-weight="400">確認能否放進實際產線</text><rect x="970" y="228" width="420" height="510" rx="18" fill="#985e38"/><text x="998" y="288" font-size="42" fill="#d8c69b" font-weight="600">03</text><text x="1085" y="287" font-size="40" fill="#fff" font-weight="600">生意可持續</text><circle cx="1180" cy="410" r="62" fill="#fff" opacity=".1"/><path d="M1132 427h97M1147 427v-38m33 38v-60m33 60v-81" stroke="#ead8b2" stroke-width="7"/><text x="998" y="533" font-size="29" fill="#e7eee6" font-weight="400">交付、重複採購與回款</text><text x="998" y="608" font-size="29" fill="#fff" font-weight="400">採用成本、服務與資本</text><text x="998" y="660" font-size="29" fill="#fff" font-weight="400">判斷供應關係能否延續</text><text x="50" y="812" font-size="28" fill="#465b51" font-weight="400">研究用途：這三層證據可以平行補強，</text><text x="50" y="854" font-size="28" fill="#465b51" font-weight="400">不代表所有產業共用的固定認證順序。</text><text x="50" y="905" font-size="21" fill="#647268" font-weight="400">本文研究整理｜原始案例：UL、BASF、Toray／NCAMP</text></g></svg>
