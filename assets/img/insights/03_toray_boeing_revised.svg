<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-label="Toray × Boeing｜航太複材的產業導入路徑">
<style>
.title{font:700 52px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;fill:#1d2d27}
.subtitle{font:25px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;fill:#58665e}
.head{font:700 26px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;fill:#223c32}
.sub{font:700 24px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;fill:#304c40}
.body{font:22px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;fill:#435349}
.num{font:700 22px Georgia,serif;fill:#fff}
.chip{font:600 20px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;fill:#355549}
.tiny{font:18px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;fill:#6b7971}
</style>
<rect width="1440" height="850" fill="#f7f7f3"/>
<rect x="32" y="43" width="45" height="4" fill="#a6b4a5"/>
<text x="32" y="113" class="title">Toray × Boeing｜航太複材的產業導入路徑</text>
<text x="32" y="171" class="subtitle">不只看重量與強度，還要看認證、製造與供應的連續性。</text>
<g transform="translate(32 226)">
<rect width="330" height="470" rx="16" fill="#fffdf9" stroke="#dcded7"/>
<circle cx="44" cy="45" r="23" fill="#305448"/><text x="44" y="52" text-anchor="middle" class="num">1</text>
<text x="80" y="54" class="head">01｜材料性能</text>
<line x1="24" y1="89" x2="306" y2="89" stroke="#d8dcd4"/>
<text x="26" y="142" class="sub">碳纖維／預浸材料</text><text x="26" y="195" class="body">重量、強度與耐久</text><text x="26" y="248" class="body">依應用情境評估</text><text x="26" y="301" class="body">整體材料表現</text>
<rect x="24" y="390" width="282" height="54" rx="9" fill="#edf2ed"/>
<text x="165" y="423" text-anchor="middle" class="chip">技術數據只是起點</text>
</g><g transform="translate(383 226)">
<rect width="330" height="470" rx="16" fill="#fffdf9" stroke="#dcded7"/>
<circle cx="44" cy="45" r="23" fill="#305448"/><text x="44" y="52" text-anchor="middle" class="num">2</text>
<text x="80" y="54" class="head">02｜驗證與追溯</text>
<line x1="24" y1="89" x2="306" y2="89" stroke="#d8dcd4"/>
<text x="26" y="142" class="sub">材料與製程驗證</text><text x="26" y="195" class="body">批次品質一致性</text><text x="26" y="248" class="body">可追溯的供應管理</text><text x="26" y="301" class="body">長期可靠性測試</text>
<rect x="24" y="390" width="282" height="54" rx="9" fill="#edf2ed"/>
<text x="165" y="423" text-anchor="middle" class="chip">高可靠性產業門檻</text>
</g><g transform="translate(734 226)">
<rect width="330" height="470" rx="16" fill="#fffdf9" stroke="#dcded7"/>
<circle cx="44" cy="45" r="23" fill="#305448"/><text x="44" y="52" text-anchor="middle" class="num">3</text>
<text x="80" y="54" class="head">03｜結構應用</text>
<line x1="24" y1="89" x2="306" y2="89" stroke="#d8dcd4"/>
<text x="26" y="142" class="sub">787 複材供應關係</text><text x="26" y="195" class="body">2014 年公告 777X</text><text x="26" y="248" class="body">機翼複材協議</text><text x="26" y="301" class="body">2015 年延伸合作</text>
<rect x="24" y="390" width="282" height="54" rx="9" fill="#edf2ed"/>
<text x="165" y="423" text-anchor="middle" class="chip">以企業當年公告為準</text>
</g><g transform="translate(1085 226)">
<rect width="330" height="470" rx="16" fill="#fffdf9" stroke="#dcded7"/>
<circle cx="44" cy="45" r="23" fill="#305448"/><text x="44" y="52" text-anchor="middle" class="num">4</text>
<text x="80" y="54" class="head">04｜長期交付</text>
<line x1="24" y1="89" x2="306" y2="89" stroke="#d8dcd4"/>
<text x="26" y="142" class="sub">產線投入與品質系統</text><text x="26" y="195" class="body">穩定交付能力</text><text x="26" y="248" class="body">客戶採用與訂單</text><text x="26" y="301" class="body">資本負擔和競爭位置</text>
<rect x="24" y="390" width="282" height="54" rx="9" fill="#edf2ed"/>
<text x="165" y="423" text-anchor="middle" class="chip">供應資格 ≠ 高利潤</text>
</g>
<line x1="32" y1="745" x2="1408" y2="745" stroke="#cfd6cf"/>
<text x="32" y="787" class="tiny">示意圖依 Boeing 2014 與 Toray 2015 年公開資料整理；非特定機型工程圖。</text>
<text x="1408" y="800" text-anchor="end" class="tiny">Peace Capital · 03</text>
</svg>